<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* ==========================================================================
     玉兆 · 仙侠沉浸风设计系统 (Yu Zhao Xianxia Design System)
     ========================================================================== */
  :root {
    --yz-font-serif: "LXGW WenKai", "STKaiti", "KaiTi", "Songti SC", "SimSun", serif, system-ui;
    --yz-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --yz-z-index: 2147483646;

    /* 玉质与背景基调 */
    --yz-bg-deep: #060e10;
    --yz-bg-card: rgba(12, 28, 30, 0.78);
    --yz-bg-card-hover: rgba(18, 42, 45, 0.9);
    --yz-bg-glass: rgba(8, 20, 22, 0.88);
    --yz-bg-subtle: rgba(40, 90, 85, 0.15);
    
    /* 边框与光晕 */
    --yz-border-jade: rgba(74, 222, 128, 0.22);
    --yz-border-bright: rgba(130, 240, 200, 0.45);
    --yz-border-subtle: rgba(255, 255, 255, 0.08);
    --yz-shadow-main: 0 16px 48px rgba(0, 0, 0, 0.65), 0 0 24px rgba(22, 101, 80, 0.25);
    --yz-shadow-glow: 0 0 16px rgba(56, 239, 125, 0.35);

    /* 玉色文字体系 */
    --yz-text-primary: #e6f7f4;
    --yz-text-secondary: #9ecac3;
    --yz-text-muted: #5e8f87;
    --yz-text-gold: #f6d365;

    /* 核心灵玉色彩 */
    --yz-jade-emerald: #10b981;
    --yz-jade-light: #34d399;
    --yz-jade-dark: #064e3b;
    --yz-gold-accent: #fbbf24;
    --yz-danger: #f87171;
    --yz-danger-bg: rgba(220, 38, 38, 0.18);
    --yz-warn: #fbbf24;
    --yz-info: #38bdf8;

    /* 八卦五行强调色 */
    --yz-gua-qian: #93c5fd; /* 乾·天 金白 */
    --yz-gua-kun: #fbbf24;  /* 坤·地 土黄 */
    --yz-gua-zhen: #2dd4bf; /* 震·雷 苍碧 */
    --yz-gua-xun: #4ade80;  /* 巽·风 青绿 */
    --yz-gua-kan: #38bdf8;  /* 坎·水 玄蓝 */
    --yz-gua-li: #f87171;   /* 离·火 赤红 */
    --yz-gua-gen: #94a3b8;  /* 艮·山 岩灰 */
    --yz-gua-dui: #cbd5e1;  /* 兑·泽 银泽 */

    --yz-sync-glow: rgba(56, 239, 125, 0.4);
    --yz-fab-size: 52px;
  }

  /* 悬浮玉佩入口 (Floating Jade Amulet) */
  #yu-zhao-fab {
    position: fixed;
    width: var(--yz-fab-size);
    height: var(--yz-fab-size);
    padding: 0;
    margin: 0;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    overflow: visible;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2a6358, #0d2826 70%, #061514);
    border: 1.5px solid var(--yz-border-bright);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 14px rgba(52, 211, 153, 0.35);
    cursor: pointer;
    pointer-events: auto;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    touch-action: none;
    z-index: var(--yz-z-index);
    /* 预留曲面屏侧边缓冲与系统导航条底边缓冲 */
    bottom: max(96px, calc(80px + env(safe-area-inset-bottom, 0px)));
    right: max(22px, calc(18px + env(safe-area-inset-right, 0px)));
    box-sizing: border-box;
    font-family: var(--yz-font-sans);
  }
  #yu-zhao-fab:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 22px rgba(52, 211, 153, 0.55);
    border-color: #6ee7b7;
  }
  #yu-zhao-fab:active {
    transform: scale(0.95);
  }
  .yz-fab-inner {
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    box-sizing: border-box;
  }
  .yz-fab-icon {
    font-size: 20px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  .yz-fab-glyph {
    font-family: var(--yz-font-serif);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #e2fdf7;
    text-shadow: 0 0 6px rgba(52, 211, 153, 0.8);
    margin-top: 1px;
  }
  /* 悬浮玉佩水波纹涟漪效果 (严格正圆双层同心水波) */
  .yz-fab-pulse {
    position: absolute;
    inset: -2px;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    pointer-events: none;
    box-sizing: border-box;
  }
  .yz-fab-pulse::before,
  .yz-fab-pulse::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(52, 211, 153, 0.5);
    box-shadow: 0 0 10px rgba(52, 211, 153, 0.35);
    box-sizing: border-box;
    animation: yz-fab-ripple 2.8s cubic-bezier(0.1, 0.7, 0.1, 1) infinite;
    pointer-events: none;
  }
  .yz-fab-pulse::after {
    animation-delay: 1.4s;
  }
  @keyframes yz-fab-ripple {
    0% {
      transform: scale(1);
      opacity: 0.85;
    }
    50% {
      opacity: 0.35;
    }
    100% {
      transform: scale(1.68);
      opacity: 0;
    }
  }
  .yz-fab-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 9px;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid #061514;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  /* 主模态遮罩与视窗 (Overlay Window) */
  #yu-zhao-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 12, 14, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    pointer-events: auto;
    display: none;
    align-items: center;
    justify-content: center;
    /* 预留曲面屏与状态栏安全区内边距，杜绝贴边变形与误触 */
    padding: max(16px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    z-index: var(--yz-z-index);
    box-sizing: border-box;
    font-family: var(--yz-font-sans);
    color: var(--yz-text-primary);
  }
  #yu-zhao-overlay.yz-open {
    display: flex;
  }
  #yu-zhao-overlay *, #yu-zhao-overlay *::before, #yu-zhao-overlay *::after {
    box-sizing: border-box;
    margin: 0; padding: 0;
  }

  .yz-window {
    width: 100%;
    max-width: 960px;
    height: 88vh;
    max-height: 860px;
    background: radial-gradient(circle at 50% 0%, #0d282a, var(--yz-bg-deep) 75%);
    border: 1.5px solid var(--yz-border-bright);
    border-radius: 18px;
    box-shadow: var(--yz-shadow-main);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    transform: scale(1) translateY(0);
    animation: yz-win-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes yz-win-in {
    from { transform: scale(0.96) translateY(12px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* 顶栏 Header */
  .yz-header {
    padding: max(12px, calc(8px + env(safe-area-inset-top, 0px))) max(22px, calc(18px + env(safe-area-inset-right, 0px))) 12px max(22px, calc(18px + env(safe-area-inset-left, 0px)));
    background: rgba(8, 24, 26, 0.85);
    border-bottom: 1px solid var(--yz-border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .yz-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .yz-logo-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .yz-logo-icon {
    font-size: 20px;
    color: var(--yz-jade-light);
    filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.6));
  }
  .yz-logo-title {
    font-family: var(--yz-font-serif);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--yz-text-primary);
    text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
  }
  .yz-space-capsule {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(20, 50, 52, 0.6);
    border: 1px solid var(--yz-border-jade);
    font-size: 12px;
    color: var(--yz-text-secondary);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .yz-space-capsule:hover {
    background: rgba(30, 75, 78, 0.8);
    border-color: var(--yz-border-bright);
    color: var(--yz-text-primary);
  }
  .yz-space-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--yz-jade-light);
    box-shadow: 0 0 6px var(--yz-jade-light);
  }

  .yz-header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .yz-btn-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--yz-border-subtle);
    background: rgba(255, 255, 255, 0.04);
    color: var(--yz-text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .yz-btn-icon:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--yz-text-primary);
    border-color: var(--yz-border-bright);
  }

  /* 视图主体 Container */
  .yz-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 18px max(24px, calc(18px + env(safe-area-inset-right, 0px))) max(22px, calc(16px + env(safe-area-inset-bottom, 0px))) max(24px, calc(18px + env(safe-area-inset-left, 0px)));
    position: relative;
    scrollbar-width: thin;
    scrollbar-color: rgba(52, 211, 153, 0.3) transparent;
  }
  .yz-body::-webkit-scrollbar {
    width: 6px;
  }
  .yz-body::-webkit-scrollbar-thumb {
    background: rgba(52, 211, 153, 0.25);
    border-radius: 3px;
  }

  /* ==========================================================================
     太极八卦盘主界面视图 (Taiji Bagua Wheel View)
     ========================================================================== */
  .yz-wheel-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 10px 0;
    gap: 20px;
  }
  .yz-wheel-stage {
    position: relative;
    width: 440px;
    height: 440px;
    max-width: min(440px, calc(100vw - 64px));
    max-height: min(440px, calc(100vw - 64px));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
  }
  
  /* 盘面外环符文光圈 */
  .yz-wheel-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px dashed rgba(52, 211, 153, 0.22);
    animation: yz-ring-rotate 120s linear infinite reverse;
    pointer-events: none;
  }
  .yz-wheel-ring-inner {
    position: absolute;
    inset: 154px;
    border-radius: 50%;
    border: 1px dotted rgba(74, 222, 128, 0.2);
    animation: yz-ring-rotate 60s linear infinite;
    pointer-events: none;
  }
  @keyframes yz-ring-rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* 太极中枢 (Taiji Core - 悬浮于空心圆中央) */
  .yz-taiji-hub {
    position: absolute;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle, #0e3032, #041012);
    border: 2px solid var(--yz-border-bright);
    box-shadow: 0 0 24px var(--yz-sync-glow), inset 0 0 16px rgba(0,0,0,0.8);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .yz-taiji-hub:hover {
    transform: scale(1.08);
    box-shadow: 0 0 36px var(--yz-sync-glow), inset 0 0 10px rgba(52, 211, 153, 0.4);
    border-color: #6ee7b7;
  }
  .yz-taiji-svg {
    width: 66px;
    height: 66px;
    animation: yz-taiji-spin 30s linear infinite;
    filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.5));
  }
  @keyframes yz-taiji-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .yz-taiji-label {
    position: absolute;
    bottom: -13px;
    font-family: var(--yz-font-serif);
    font-size: 10px;
    color: var(--yz-text-secondary);
    background: rgba(6, 18, 20, 0.92);
    padding: 1px 7px;
    border-radius: 10px;
    border: 1px solid var(--yz-border-subtle);
    white-space: nowrap;
    pointer-events: none;
  }

  /* ==========================================================================
     八等分空心圆八卦盘扇面 (8 Annular Sectors Feature Entrances)
     ========================================================================== */
  .yz-bagua-annulus-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    overflow: visible;
  }
  .yz-gua-sector {
    cursor: pointer;
    user-select: none;
    outline: none;
    transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .yz-gua-sector:hover,
  .yz-gua-sector:focus-visible {
    transform: translate(var(--shift-x, 0), var(--shift-y, 0));
  }
  .yz-sector-path {
    fill: rgba(8, 26, 28, 0.78);
    stroke: var(--yz-border-jade, rgba(52, 211, 153, 0.28));
    stroke-width: 1.5;
    stroke-linejoin: round;
    transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
  }
  .yz-sector-inner-rim {
    fill: none;
    stroke: rgba(255, 255, 255, 0.06);
    stroke-width: 1;
    pointer-events: none;
    transition: stroke 0.22s ease;
  }
  .yz-gua-sector:hover .yz-sector-path,
  .yz-gua-sector:focus-visible .yz-sector-path {
    fill: rgba(14, 46, 50, 0.95);
    stroke: var(--gua-accent, #34d399);
    stroke-width: 2.2;
    filter: drop-shadow(0 0 14px var(--gua-accent, rgba(52, 211, 153, 0.55)));
  }
  .yz-gua-sector:hover .yz-sector-inner-rim {
    stroke: var(--gua-accent, rgba(52, 211, 153, 0.3));
  }
  .yz-sector-symbol {
    font-family: var(--yz-font-serif);
    font-size: 22px;
    line-height: 1;
    fill: var(--gua-accent, var(--yz-text-primary));
    text-anchor: middle;
    dominant-baseline: central;
    filter: drop-shadow(0 0 6px var(--gua-accent, rgba(52, 211, 153, 0.5)));
    pointer-events: none;
    transition: all 0.22s ease;
  }
  .yz-gua-sector:hover .yz-sector-symbol {
    transform: scale(1.14);
    filter: drop-shadow(0 0 10px var(--gua-accent, rgba(52, 211, 153, 0.85)));
  }
  .yz-sector-name {
    font-family: var(--yz-font-serif);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    fill: var(--yz-text-primary);
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    transition: all 0.22s ease;
  }
  .yz-gua-sector:hover .yz-sector-name {
    fill: #ffffff;
  }
  .yz-sector-feature {
    font-size: 10.5px;
    letter-spacing: 0.5px;
    fill: var(--yz-text-secondary);
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    transition: all 0.22s ease;
  }
  .yz-gua-sector:hover .yz-sector-feature {
    fill: var(--gua-accent, #a7f3d0);
  }
  .yz-sector-badge-bg {
    fill: #ef4444;
    stroke: #061514;
    stroke-width: 1.5;
    filter: drop-shadow(0 0 6px rgba(239, 68, 68, 0.6));
  }
  .yz-sector-badge.yz-new .yz-sector-badge-bg {
    fill: #10b981;
    filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.6));
  }
  .yz-sector-badge-text {
    font-size: 9.5px;
    font-weight: 700;
    fill: #ffffff;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }
  .yz-gua-sealed {
    opacity: 0.42;
    filter: grayscale(0.85);
  }
  .yz-gua-sealed:hover {
    transform: none !important;
  }
  .yz-sector-seal-bg {
    fill: rgba(6, 18, 20, 0.88);
    stroke: rgba(255, 255, 255, 0.16);
    stroke-width: 1;
  }
  .yz-sector-seal-text {
    font-size: 9px;
    fill: var(--yz-text-muted);
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  /* 同步信息与底部状态条 */
  .yz-wheel-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 8px 18px;
    border-radius: 24px;
    background: rgba(10, 26, 28, 0.65);
    border: 1px solid var(--yz-border-subtle);
    font-size: 12px;
    color: var(--yz-text-secondary);
    max-width: min(420px, calc(100% - 24px));
    margin: 0 auto;
    box-sizing: border-box;
  }
  .yz-sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--yz-jade-light);
    box-shadow: 0 0 8px var(--yz-jade-light);
  }
  .yz-sync-dot.yz-partial { background: var(--yz-warn); box-shadow: 0 0 8px var(--yz-warn); }
  .yz-sync-dot.yz-invalid { background: var(--yz-danger); box-shadow: 0 0 8px var(--yz-danger); }

  /* ==========================================================================
     通用子页面卡片与布局系统 (防贴边曲面屏友好)
     ========================================================================== */
  .yz-subview {
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: yz-view-in 0.2s ease-out;
    padding: 2px 2px 8px 2px;
  }
  @keyframes yz-view-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .yz-subview-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 2px 4px;
  }
  .yz-subview-title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .yz-subview-icon {
    font-family: var(--yz-font-serif);
    font-size: 24px;
    color: var(--yz-jade-light);
  }
  .yz-subview-title {
    font-family: var(--yz-font-serif);
    font-size: 20px;
    font-weight: 700;
    color: var(--yz-text-primary);
    letter-spacing: 1px;
  }
  .yz-subview-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 选项卡 Tabs */
  .yz-tabs {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--yz-border-subtle);
    padding: 2px 4px 10px 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .yz-tabs::-webkit-scrollbar {
    display: none;
  }
  .yz-tab-btn {
    padding: 6px 14px;
    border-radius: 12px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--yz-text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .yz-tab-btn:hover {
    color: var(--yz-text-primary);
    background: rgba(255, 255, 255, 0.04);
  }
  .yz-tab-btn.yz-active {
    color: #061514;
    background: linear-gradient(135deg, #34d399, #10b981);
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
  }

  /* 搜索栏与输入 */
  .yz-search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(8, 22, 24, 0.7);
    border: 1px solid var(--yz-border-jade);
    border-radius: 10px;
    padding: 8px 14px;
    margin: 0 2px;
  }
  .yz-search-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--yz-text-primary);
    font-size: 13px;
  }
  .yz-search-input::placeholder {
    color: var(--yz-text-muted);
  }

  /* 卡片 Grid & 容器 (预留防贴边边距) */
  .yz-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    padding: 2px 2px;
  }
  .yz-card {
    background: var(--yz-bg-card);
    border: 1px solid var(--yz-border-jade);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    transition: all 0.18s ease;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }
  .yz-card:hover {
    border-color: var(--yz-border-bright);
    background: var(--yz-bg-card-hover);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  }
  .yz-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .yz-card-title {
    font-family: var(--yz-font-serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--yz-text-primary);
  }
  .yz-card-body {
    font-size: 13px;
    color: var(--yz-text-secondary);
    line-height: 1.5;
  }
  .yz-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--yz-text-muted);
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 8px;
    margin-top: 4px;
  }

  /* 传音符与消息流 (Messages) */
  .yz-msg-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 480px;
    gap: 12px;
  }
  .yz-chat-stream {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 6px;
  }
  .yz-msg-bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.55;
    position: relative;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
  }
  .yz-msg-bubble.yz-self {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(5, 150, 105, 0.35));
    border: 1px solid rgba(52, 211, 153, 0.4);
    color: #e6fdf7;
    border-bottom-right-radius: 3px;
  }
  .yz-msg-bubble.yz-other {
    align-self: flex-start;
    background: rgba(18, 42, 45, 0.7);
    border: 1px solid var(--yz-border-subtle);
    color: var(--yz-text-primary);
    border-bottom-left-radius: 3px;
  }
  .yz-msg-meta {
    font-size: 10px;
    color: var(--yz-text-muted);
    margin-top: 4px;
    text-align: right;
  }

  .yz-chat-input-bar {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(10, 26, 28, 0.85);
    border: 1px solid var(--yz-border-jade);
    border-radius: 12px;
    margin: 4px 2px 4px 2px;
  }
  .yz-input {
    flex: 1;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--yz-border-subtle);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--yz-text-primary);
    font-size: 13px;
    outline: none;
  }
  .yz-input:focus {
    border-color: var(--yz-border-bright);
  }
  .yz-btn-primary {
    padding: 8px 18px;
    border-radius: 8px;
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .yz-btn-primary:hover {
    background: linear-gradient(135deg, #34d399, #10b981);
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
  }

  /* 对话框与表单 Modal */
  .yz-modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 8, 0.75);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top, 0px)) max(22px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
    z-index: 2147483648;
    animation: yz-modal-in 0.18s ease-out;
    box-sizing: border-box;
  }
  @keyframes yz-modal-in {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  .yz-modal-card {
    width: 100%;
    max-width: 480px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    background: radial-gradient(circle at 50% 0%, #133438, #071719);
    border: 1.5px solid var(--yz-border-bright);
    border-radius: 16px;
    box-shadow: var(--yz-shadow-main);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .yz-modal-title {
    font-family: var(--yz-font-serif);
    font-size: 18px;
    font-weight: 700;
    color: var(--yz-text-primary);
  }

  /* Toast 通知 Stack (底栏安全区抬高) */
  .yz-toast-stack {
    position: fixed;
    bottom: max(24px, calc(16px + env(safe-area-inset-bottom, 0px)));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 2147483647;
    pointer-events: none;
    width: max-content;
    max-width: calc(100vw - 48px);
  }
  .yz-toast {
    padding: 9px 20px;
    border-radius: 20px;
    background: rgba(8, 26, 28, 0.95);
    border: 1px solid var(--yz-border-bright);
    color: var(--yz-text-primary);
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    animation: yz-toast-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 100%;
    word-break: break-word;
  }
  @keyframes yz-toast-in {
    from { opacity: 0; transform: translateY(12px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 空状态 */
  .yz-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 240px;
    gap: 12px;
    color: var(--yz-text-muted);
    font-family: var(--yz-font-serif);
    font-size: 14px;
    padding: 16px 20px;
  }
  .yz-empty-icon {
    font-size: 36px;
    color: var(--yz-text-muted);
    opacity: 0.6;
  }

  /* ==========================================================================
     响应式移动端与曲面屏适配 (Curved / Notch / Bezel Safe Area)
     ========================================================================== */
  @media (max-width: 640px) {
    #yu-zhao-overlay {
      /* 预留安全外边距，避免窗口贴死屏幕四周边框与弧面 */
      padding: max(10px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    }
    .yz-window {
      height: calc(100vh - max(24px, calc(env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px))));
      max-height: 100vh;
      border-radius: 16px;
      border: 1px solid var(--yz-border-bright);
    }
    .yz-header {
      padding: 10px 14px;
      gap: 8px;
    }
    .yz-logo-title {
      font-size: 15px;
      letter-spacing: 1px;
    }
    .yz-space-capsule {
      padding: 3px 8px;
      font-size: 11px;
    }
    .yz-body {
      padding: 14px 14px 18px 14px;
    }
    .yz-wheel-stage {
      width: min(290px, calc(100vw - 44px));
      height: min(290px, calc(100vw - 44px));
      margin: 0 auto;
    }
    .yz-wheel-ring-inner {
      inset: 102px;
    }
    .yz-taiji-hub {
      width: 66px;
      height: 66px;
    }
    .yz-taiji-svg {
      width: 44px;
      height: 44px;
    }
    .yz-taiji-label {
      bottom: -9px;
      font-size: 8.5px;
      padding: 0 4px;
    }
    .yz-sector-symbol { font-size: 17px; }
    .yz-sector-name { font-size: 10.5px; }
    .yz-sector-feature { font-size: 8.5px; }
    .yz-card-grid {
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 2px 0;
    }
    .yz-modal-card {
      max-width: calc(100vw - 28px);
      padding: 16px 18px;
      border-radius: 14px;
    }
    .yz-msg-bubble {
      max-width: 86%;
    }
  }
</style>
</head>
<body>

<!-- 悬浮玉佩入口 (Floating Jade Amulet) -->

<div id="yu-zhao-overlay" class="yz-overlay" role="dialog" aria-modal="true">
  <div class="yz-window">
    <!-- 顶栏 Header -->
    <header class="yz-header">
      <div class="yz-header-left">
        <div id="yu-zhao-logo-btn" class="yz-logo-badge" title="回到卦盘主界面">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>

        </button>
      </div>
    </header>

    <!-- 视图主体容器 -->
    <main id="yu-zhao-body" class="yz-body"></main>
  </div>
</div>

<!-- 弹窗模态宿主容器 -->
<div id="yu-zhao-dialogs"></div>

<!-- 全局 Toast 提示容器 -->
<div id="yu-zhao-toasts" class="yz-toast-stack"></div>

<!-- yu-zhao-ui-script -->
