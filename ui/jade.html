            event.stopPropagation();
            cancelConfirm();
          }
        });
        function cancelConfirm() {
          confirmAction = null;
          hideConfirm();
        }
      }
      return overlay;
    }

    // 危险操作二次确认：居中 modal（遮罩 + 标题 + 文案 + 取消/确认），
    // 比小 toast 醒目得多，宿主侧边栏展开时也不会被遮挡。无操作时保持显示，
    // 用户点「取消」或遮罩外关闭；只有点「确认」才执行 fn。
    // confirmChatId：弹框时锁定的聊天，确认时校验仍指向同一聊天才执行——
    // 防弹框期间切换聊天后「确认清除」误清新聊天的数据。
    var confirmAction = null;
    var confirmChatId = null;
    // 最近一次确认框参数：语言切换时重放，保证开着的确认框文案随语言刷新。
    var confirmLast = null;
    function showConfirm(title, message, okLabel, fn) {
      clearToast();
      var host = hostDocument.getElementById('yz1-confirm');
      if (!host) return;
      confirmAction = fn || null;
      confirmChatId = runtime.activeChatId;
      confirmLast = { title: title, message: message, okLabel: okLabel };
      var titleNode = host.querySelector('.yz-confirm-title');
      var msgNode = host.querySelector('.yz-confirm-msg');
      var okBtn = host.querySelector('.yz-confirm-ok');
      var cancelBtn = host.querySelector('.yz-confirm-cancel');
      if (titleNode) titleNode.textContent = title;
      if (msgNode) msgNode.textContent = message;
      if (okBtn) okBtn.textContent = okLabel;
      if (cancelBtn) cancelBtn.textContent = I18N.dict().cancel;
      // 无障碍：标题/正文与对话框关联（aria-labelledby/describedby），焦点移入「取消」
      // 按钮——默认焦点放安全动作，避免误触「确认」清空数据。
      var titleId = 'yz-confirm-title';
      var msgId = 'yz-confirm-msg';
      var box = host.querySelector('.yz-confirm-box');
      if (box) {
        if (titleNode) titleNode.id = titleId;
        if (msgNode) msgNode.id = msgId;
        host.setAttribute('aria-labelledby', titleId);
        host.setAttribute('aria-describedby', msgId);
      }
      host.classList.add('show');
      if (cancelBtn && typeof cancelBtn.focus === 'function') cancelBtn.focus();
    }
    // 语言切换后重放确认框文案（按钮/遮罩/Esc 关闭时清掉 confirmLast）。
    function refreshConfirmText() {
      var host = hostDocument.getElementById('yz1-confirm');
      if (!host || !confirmLast || !host.classList.contains('show')) return;
      var titleNode = host.querySelector('.yz-confirm-title');
      var msgNode = host.querySelector('.yz-confirm-msg');
      var okBtn = host.querySelector('.yz-confirm-ok');
      var cancelBtn = host.querySelector('.yz-confirm-cancel');
      if (titleNode) titleNode.textContent = confirmLast.title;
      if (msgNode) msgNode.textContent = confirmLast.message;
      if (okBtn) okBtn.textContent = confirmLast.okLabel;
      if (cancelBtn) cancelBtn.textContent = I18N.dict().cancel;
    }
    function hideConfirm() {
      confirmAction = null;
      confirmChatId = null;
      confirmLast = null;
      var host = hostDocument.getElementById('yz1-confirm');
      if (host) host.classList.remove('show');
    }

    function clearToast() {
      clearAppTimeout(toastTimer);
      toastTimer = 0;
      toastAction = null;
      var toast = hostDocument.getElementById('yz1-toast');
      if (toast) { toast.classList.remove('show', 'bad', 'has-action'); toast.innerHTML = ''; }
    }

    // 可选内嵌操作按钮（撤销/确认等）：text 用文本节点（防注入），按钮走委托。
    // duration：默认 2.4s；确认类（如清除玉兆数据）需要更长的阅读/决策窗口。
    function showToast(text, bad, action, duration) {
      if (disposed) return;
      var toast = hostDocument.getElementById('yz1-toast');
      if (!toast) return;
      // 先清空上一条：2.4s 内连续两条 toast 不拼接、旧内嵌按钮（撤销等）不残留——
      // 否则旧按钮还在 DOM 里、toastAction 已被替换，点了会触发错动作。
      clearToast();
      toastAction = action && action.fn ? action.fn : null;
      toast.appendChild(hostDocument.createTextNode(text));
      if (action && action.label) {
        var btn = hostDocument.createElement('button');
        btn.type = 'button';
        btn.className = 'yz-toast-action';
        btn.textContent = action.label;
        toast.appendChild(btn);
      }
      toast.classList.toggle('bad', !!bad);
      toast.classList.toggle('has-action', !!(action && action.label));
      toast.classList.add('show');
      toastTimer = setAppTimeout(clearToast, duration || (bad ? 6000 : 2400));
    }

    // shell DOM 只在首次创建，语言切换不会重建：顶栏品牌与各 aria-label 属于静态节点，
    // 每次渲染时统一刷新，保证切换 App 语言后无上一语言的残留。
    function renderShellStatic(overlay) {
      var t = I18N.dict();
      var jade = overlay.querySelector('#' + JADE_ID);
      if (jade) jade.setAttribute('aria-label', t.appName);
      var brand = overlay.querySelector('.yz-topbar b');
      if (brand) brand.textContent = t.brand.title;
      var sub = overlay.querySelector('.yz-topbar .yz-sub');
      if (sub) sub.textContent = t.brand.sub;
      var closeBtn = overlay.querySelector('[data-action="close"]');
      if (closeBtn) closeBtn.setAttribute('aria-label', t.closePhone);
      // 空间切换按钮：显示当前空间名，点开进入空间管理（切换/新建/删除/开关）。
      var spaceBtn = overlay.querySelector('[data-action="switch-space"]');
      if (spaceBtn) {
        var label = currentSpaceName();
        spaceBtn.textContent = (label || t.spaceShort) + ' ▾';
        spaceBtn.setAttribute('aria-label', tr('runtime.space.switchAria', { name: label || t.spaceShort }));
      }
    }

    function currentSpace() {
      return runtime.activeSpace();
    }

    function currentSpaceName() {
      var state = runtime.current();
      var sp = currentSpace();
      if (!sp) return '';
      return CORE.spaceDisplayName(state, sp, sp.isDefault ? I18N.dict().spaceDefaultName : '');
    }

    function renderPageKey() {
      var space = currentSpace();
      var params = nav.params || {};
      return String(runtime.activeChatId || '') + '|' + String(space && space.id || '') + '|' +
        String(nav.app || '') + '|' + String(nav.view || '') + '|' + String(params.id || '');
    }

    function capturePageDraft(pageNode) {
      if (!pageNode || !pageNode.querySelectorAll) return null;
      var draft = { key: renderPageKey(), fields: Object.create(null), importText: null, focus: null };
      Array.prototype.forEach.call(pageNode.querySelectorAll('[data-form-field]'), function (field) {
        var key = field.getAttribute('data-form-field');
        draft.fields[key] = field.type === 'checkbox' ? !!field.checked : String(field.value == null ? '' : field.value);
      });
      var importBox = pageNode.querySelector('[data-import-input]');
      if (importBox) draft.importText = String(importBox.value || '');
      var active = hostDocument.activeElement;
      if (active && pageNode.contains(active)) {
        ['data-search-input', 'data-thread-input', 'data-comment-input', 'data-form-field', 'data-import-input'].some(function (attribute) {
          if (!active.getAttribute || active.getAttribute(attribute) === null) return false;
          draft.focus = { attribute: attribute, value: active.getAttribute(attribute) || '' };
          draft.focus.selectionStart = typeof active.selectionStart === 'number' ? active.selectionStart : null;
          draft.focus.selectionEnd = typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
          return true;
        });
      }
      return draft;
    }

    function restorePageDraft(pageNode, draft) {
      if (!pageNode || !draft || draft.key !== renderPageKey()) return false;
      Object.keys(draft.fields).forEach(function (key) {
        var field = pageNode.querySelector('[data-form-field="' + CORE.escapeHtml(key) + '"]');
        if (!field) return;
        if (field.type === 'checkbox') field.checked = !!draft.fields[key];
        else field.value = draft.fields[key];
      });
      if (draft.importText !== null) {
        var importBox = pageNode.querySelector('[data-import-input]');
        if (importBox) importBox.value = draft.importText;
      }
      if (!draft.focus) return false;
      var selector = '[' + draft.focus.attribute + ']';
      if (draft.focus.attribute === 'data-form-field') selector = '[data-form-field="' + CORE.escapeHtml(draft.focus.value) + '"]';
      var target = pageNode.querySelector(selector);
      if (!target || typeof target.focus !== 'function') return false;
      target.focus();
      if (draft.focus.selectionStart != null && typeof target.setSelectionRange === 'function') {
        try { target.setSelectionRange(draft.focus.selectionStart, draft.focus.selectionEnd); } catch (_) {}
      }
      return true;
    }

    // 切换空间：停留在当前页面（子页消毒后），重渲染即看到新空间数据。
    function switchSpaceTo(id) {
      return withDiscardGuard(function () { return switchSpaceToNow(id); });
    }

    async function switchSpaceToNow(id) {
      var result = runtime.setActiveSpace(id);
      if (!result || !result.ok) {
        showToast(I18N.dict().spaceMissingEntity, true);
        return;
      }
      var persisted;
      try { persisted = await Promise.resolve(result.saved); } catch (_) { persisted = null; }
      if (!persisted || !persisted.ok) {
        showToast(I18N.dict().toast.persistenceFailed, true);
        render();
        return;
      }
      // 子页消毒：详情/表单页在新空间可能没有对应实体，回退到该 app 根视图。
      if (nav.app === 'msg' && (nav.view === 'chat' || nav.view === 'gchat' || nav.view === 'contact-form')) { nav.view = 'chats'; nav.params = {}; nav.stack = []; }
      else if (nav.app === 'notes' && (nav.view === 'note' || nav.view === 'folder' || nav.view === 'form')) { nav.view = 'folders'; nav.params = {}; nav.stack = []; }
      else if ((nav.app === 'market' || nav.app === 'space' || nav.app === 'forum') && nav.view === 'form') { nav.view = nav.app === 'market' ? 'listings' : nav.app === 'space' ? 'items' : 'root'; nav.params = {}; nav.stack = []; }
      resetSearch();
      clearToast();
      render();
    }

    // {{user}} 解析（chat.persona.name）：聊天切换时刷新，供用户发言署名。
    function refreshOwnerName() {
      runtime.resolveOwnerName().then(function () { if (!disposed) render(); }).catch(function () {});
    }

    function render() {
      if (disposed) return;
      var overlay = ensureShell();
      if (!overlay) return;
      renderShellStatic(overlay);
      var state = runtime.current();
      var space = runtime.activeSpace();
      var spaceName = currentSpaceName();
      var fab = hostDocument.getElementById(FAB_ID);
      if (fab) {
        // 玉兆打开时隐藏 FAB：全屏面板之上不再飘一个可点的玉佩（点击会静默踢回主页）。
        fab.hidden = !enabled() || !chatActive || overlay.classList.contains('open');
        // aria-label 随语言切换刷新：FAB 只在首次创建，不重渲染。
        fab.setAttribute('aria-label', I18N.dict().fabLabel);
      }
      // 插件被禁用时收起已打开的 overlay。
      if (!enabled() && overlay.classList.contains('open')) closeNow();
      var home = overlay.querySelector('[data-home]');
      var pageNode = overlay.querySelector('[data-page]');
      if (!home || !pageNode) return;
      var pageKey = renderPageKey();
      var changedPage = pageKey !== lastRenderedPageKey;
      var pageDraft = capturePageDraft(pageNode);
      if (nav.app === 'home') {
        home.classList.remove('hidden');
        pageNode.hidden = true;
        pageNode.innerHTML = '';
        var homeWrap = hostDocument.createElement('div');
        homeWrap.innerHTML = VIEWS.renderHome(state, featureFlags, { space: space, spaceName: spaceName });
        if (homeWrap.firstElementChild) home.outerHTML = homeWrap.firstElementChild.outerHTML;
        var freshHome = overlay.querySelector('[data-home]');
        if (freshHome) {
          var syncNode = freshHome.querySelector('[data-sync]');
          if (syncNode && home !== freshHome) renderHomeSync(syncNode, space);
        }
      } else {
        if (home) home.classList.add('hidden');
        // 注意：shell 初始模板中 page 带 hidden 属性（CSS [hidden]{display:none!important}），
        // 必须用 .hidden property 移除属性本身；classList.remove('hidden') 只能移除同名 class。
        pageNode.hidden = false;
        // 保留滚动位置：重渲染前记录（聊天详情未检索时除外——它固定贴底）。
        // 否则发论坛评论/搜索/管理页展开诊断等任何重渲染都会把长页弹回顶部，
        // 用户每次发一条评论都要重新滚到底部。聊天详情带检索时同样要恢复位置，
        // 不能每次按键都被钉回底部。
        var scrollNode = pageNode.querySelector('.yz-page-inner') || pageNode;
        var savedScroll = ((nav.view === 'chat' || nav.view === 'gchat') && !search) ? null : scrollNode.scrollTop;
        if (nav.app === 'tablet') {
          tabletOpenGroups = Object.create(null);
          var details = pageNode.querySelectorAll('details[data-group-id]');
          for (var d = 0; d < details.length; d += 1) {
            tabletOpenGroups[details[d].getAttribute('data-group-id')] = details[d].open;
          }
        }
        var focused = hostDocument.activeElement;
        var searchFocused = !!(focused && focused.getAttribute && focused.getAttribute('data-search-input') !== null);
        var threadFocused = !!(focused && focused.getAttribute && focused.getAttribute('data-thread-input') !== null);
        var commentFocused = !!(focused && focused.getAttribute && focused.getAttribute('data-comment-input') !== null);
        pageNode.innerHTML = VIEWS.renderPage(state, nav, featureFlags, { diagOpen: diagOpen, dataPanel: dataPanel, armed: armedWipe, search: search, space: space, spaceName: spaceName, tabletOpenGroups: tabletOpenGroups });
        syncBusyUi(pageNode);
        // 首页无导航历史时隐藏返回按钮：nav.stack 为空且当前是入口页时隐藏。
        var backBtn = pageNode.querySelector('.yz-back');
        if (backBtn) backBtn.hidden = nav.app === 'home' && nav.stack.length === 0;
        // 聊天详情（私讯/群聊/传讯）滚动到底部：每次重渲染后都贴最新消息，不把用户弹回最旧。
        // 但检索旧消息时不能钉底——否则每次按键都被拉回底部，看不到上面匹配的上下文。
        if ((nav.view === 'chat' || nav.view === 'gchat') && !search) {
          var bubbles = pageNode.querySelector('.yz-bubbles');
          if (bubbles) bubbles.scrollTop = bubbles.scrollHeight;
        } else if (savedScroll !== null && savedScroll > 0) {
          // 非聊天页恢复原滚动位置（发评论/搜索后不再跳顶）。
          var freshScrollNode = pageNode.querySelector('.yz-page-inner') || pageNode;
          freshScrollNode.scrollTop = savedScroll;
        }
        // 检索框每次按键都整体重渲染：焦点丢给新的输入框并恢复光标到末尾，
        // 否则输入一个字符后失去焦点、无法连续键入。
        if (searchFocused) {
          var freshInput = pageNode.querySelector('[data-search-input]');
          if (freshInput) {
            freshInput.focus();
            try { freshInput.setSelectionRange(search.length, search.length); } catch (_) {}
          }
        }
        // 发言输入框同理（会话/论坛评论）：整体重渲染后恢复焦点，支持连续输入。
        if (threadFocused || commentFocused) {
          var boxType = threadFocused ? 'data-thread-input' : 'data-comment-input';
          if (boxType) {
            var freshAny = pageNode.querySelector('[' + boxType + ']');
            if (freshAny) freshAny.focus();
          }
        }
        var draftFocused = pageDraft && pageDraft.key === pageKey ? restorePageDraft(pageNode, pageDraft) : false;
        if (!searchFocused && !threadFocused && !commentFocused && !draftFocused && changedPage) {
          var pageTitle = pageNode.querySelector('.yz-page-title');
          if (pageTitle && typeof pageTitle.focus === 'function') pageTitle.focus();
        }
      }
      var live = hostDocument.getElementById('yz1-live');
      if (live && changedPage) {
        var announcement = nav.app === 'home' ? (spaceName || I18N.dict().appName) :
          ((pageNode.querySelector('.yz-page-title') || {}).textContent || I18N.dict().appName);
        live.textContent = announcement;
      }
      lastRenderedPageKey = pageKey;
    }

    function renderHomeSync(node, space) {
      if (!node) return;
      var t = I18N.dict();
      var st = VIEWS.syncStatusOf(space);
      node.className = 'yz-sync ' + CORE.escapeHtml(st.status);
      node.innerHTML = '<i></i><span>' + CORE.escapeHtml(st.text) + '</span>';
      var sync = (space && space.sync) || {};
      var hero = node.parentElement && node.parentElement.querySelector('.yz-hero-line');
      if (hero) {
        var heroTitle = CORE.hasText(sync.roleName) ? sync.roleName : t.appName;
        hero.innerHTML = '<b>' + CORE.escapeHtml(heroTitle) + '</b><p>' + CORE.escapeHtml(sync.summary || t.awaitingSync) + '</p>';
      }
    }

    // 管理页瞬态状态在离开页面（回主页/开功能页/关 overlay）时复位，避免残留确认态或展开面板。

    /* ---------- UI app / transient state ---------- */
    function resetManagePanels() {
      diagOpen = false;
      dataPanel = null;
      armedWipe = null;
      clearAppTimeout(wipeTimer);
      wipeTimer = 0;
    }

    // 检索关键词只属于当前页面：任何导航（前进/后退/切换/回主界面/关闭）都清空，
    // 避免残留关键词把下一页的数据也过滤掉。
    function resetSearch() {
      search = '';
    }

    function markAppliedSeen(featureId) {
      var space = runtime.activeSpace();
      if (!space) return;
      var seen = CORE.safeArray(space.sync && space.sync.appliedSeen, 20);
      if (seen.indexOf(featureId) >= 0) return;
      space.sync.appliedSeen = seen.concat([featureId]).slice(-20);
      runtime.saveChat(runtime.activeChatId);
    }

    function openFeature(featureId) {
      return withDiscardGuard(function () { openFeatureNow(featureId); });
    }

    function openFeatureNow(featureId) {
      var t = I18N.dict();
      var feature = null;
      VIEWS.FEATURES.forEach(function (f) { if (f.id === featureId) feature = f; });
      if (!feature) return;
      if (feature.toggleable && featureFlags[featureId] === false) {
        showToast(tr('runtime.toast.sealed', { name: t.features[feature.id] || featureId }), true);
        return;
      }
      clearToast();
      resetManagePanels();
      // 查看过该卦位即并入 appliedSeen：下一轮快照再次应用时重新点亮「新」徽标。
      markAppliedSeen(featureId);
      nav = { app: featureId, view: 'root', params: {}, stack: [] };
      resetSearch();
      render();
    }

    // 同步详情页：入栈当前页面，返回键逐级回退到入口页。
    function openSyncDetail() {
      clearToast();
      nav.stack.push({ app: nav.app, view: nav.view, params: nav.params });
      nav.app = 'sync';
      nav.view = 'root';
      nav.params = {};
      resetSearch();
      render();
    }

    // 单功能清空：只重置该分区并落盘；绝不动 processedTurns——否则下一轮相同 turnId 会被去重误挡。
    // 玩家真实数据（传讯/发帖）以玩家域为源：清空角色域分区后立即补投镜像，避免
    // 空窗期导出/注入基线缺玩家数据。
    // 两击确认倒计时：武装后每秒刷新 armed 按钮文案（「(N)」），超时由 wipeTimer 复位。
    // 只在 armed 按钮存在时工作，不整页重渲染（避免打断输入/滚动）。
    var wipeTick = null;
    function startWipeCountdown() {
      stopWipeCountdown();
      wipeTick = setAppInterval(function () {
        if (!armedWipe) { stopWipeCountdown(); return; }
        var remain = Math.max(0, Math.ceil((armedWipe.expiresAt - Date.now()) / 1000));
        var nodes = hostDocument.querySelectorAll('#' + OVERLAY_ID + ' .armed');
        Array.prototype.forEach.call(nodes, function (node) {
          if (!node.dataset || !node.dataset.wipeBase) return;
          node.textContent = node.dataset.wipeBase + tr('runtime.sep.count', { n: remain });
        });
      }, 500);
    }
    function stopWipeCountdown() {
      if (wipeTick) { clearAppInterval(wipeTick); wipeTick = null; }
    }

    /* ---------- UI app / data actions ---------- */

    function clearFeatureData(featureId) {
      var blank = CORE.blankFeatureField(featureId);
      if (!blank) return;
      // 清空是跨空间操作：所有用户空间的该分区一起归零（导出/导入的整份状态同样处理）。
      CORE.safeArray(runtime.current().spaces, 6).forEach(function (sp) {
        sp[CORE.FEATURE_FIELDS[featureId]] = CORE.blankFeatureField(featureId);
        // 清空后旧摘要/角色名/绿点仍会被主页直接展示，必须与被清空分区一起失效。
        sp.sync = Object.assign({}, sp.sync, {
          status: 'empty', turnId: '', roleName: '', summary: '', applied: [], appliedSeen: [],
          issues: [], lastError: '', lastSource: '', updatedAt: Date.now()
        });
      });
      // 强制下一轮全量重建：单功能清空后 sync 状态/旧摘要/issue 回声仍指向旧数据，
      // 不清 pendingFull 的话 meta-only diff 轮提前返回，假「complete」绿点残留。
      runtime.current().pendingFull = true;
      runtime.current().updatedAt = Date.now();
      var saved = runtime.saveChat(runtime.activeChatId, { forceSnapshot: true });
      var cutoffSaved = runtime.markHistoryCutoff(runtime.activeChatId);
      armedWipe = null;
      render();
      Promise.all([saved, cutoffSaved]).then(function (results) {
        if (results.every(function (result) { return result && result.ok; })) showToast(tr('runtime.manage.cleared', { name: I18N.dict().features[featureId] || featureId }));
        else showToast(I18N.dict().toast.persistenceFailed, true);
      });
    }

    // 侧边栏「清除玉兆数据」：当前聊天的角色域与玩家域全部数据归零。
    // 调用前必须完成二次确认（首击只弹确认 toast，确认按钮才真正清除）。
    function clearAllData() {
      var chatId = runtime.activeChatId;
      var state = runtime.current();
      // 全部用户空间数据归零：只剩一个空白默认空间（同步状态一并重置）。
      // 强制下一轮全量重建：不清 pendingFull 的话 meta-only diff 轮提前返回，
      // 空数据却显示「已同步」。processedTurns 不清（防历史水化把已清除数据复活）。
      state.spaces = [CORE.blankUserSpace(chatId, { id: CORE.DEFAULT_SPACE_ID, isDefault: true })];
      state.activeSpaceId = CORE.DEFAULT_SPACE_ID;
      state.pendingFull = true;
      state.updatedAt = Date.now();
      var saved = runtime.saveChat(chatId, { forceSnapshot: true });
      var cutoffSaved = runtime.markHistoryCutoff(chatId);
      armedWipe = null;
      render();
      Promise.all([saved, cutoffSaved]).then(function (results) {
        var ok = results.every(function (result) { return result && result.ok; });
        showToast(ok ? I18N.dict().toast.cleared : I18N.dict().toast.persistenceFailed, !ok);
      });
    }

    // 侧边栏清除入口：首击只弹居中确认对话框（防误触不可恢复操作）——
    // 小 toast 会被宿主侧边栏等布局遮挡，确认框固定居中 + 遮罩，任何布局下都可见。
    function armSidebarClear() {
      if (!enabled()) { showToast(I18N.dict().toast.disabled, true); return; }
      // 非聊天页不操作（activeChatId 是上一个聊天的残留）。
      if (!chatActive) { showToast(I18N.dict().toast.noChat, true); return; }
      // 启动瞬间 ensureShell 可能还没执行（宿主异步加载），确认框宿主不存在会静默失败：
      // 先确保 shell（overlay/toast/确认框宿主）已创建再弹框。
      ensureShell();
      var dict = I18N.dict();
      showConfirm(dict.toast.clearTitle, dict.toast.clearConfirm, dict.toast.clearConfirmAction, clearAllData);
    }

    function armOrClearFeature(featureId) {
      var next = VIEWS.nextWipeState(armedWipe, featureId, Date.now());
      clearTimeout(wipeTimer);
      wipeTimer = 0;
      if (!next) {
        stopWipeCountdown();
        clearFeatureData(featureId);
        return;
      }
      armedWipe = next;
      wipeTimer = setTimeout(function () {
        armedWipe = null;
        wipeTimer = 0;
        stopWipeCountdown();
        render();
      }, VIEWS.WIPE_CONFIRM_MS + 50);
      startWipeCountdown();
      render();
    }

    // 全选复制导出的存档：execCommand 在 WebView 内可用性最好，clipboard API 作为补充。
    function copyExport() {
      var overlay = hostDocument.getElementById(OVERLAY_ID);
      var box = overlay && overlay.querySelector('[data-export-output]');
      if (!box) return;
      var dict = I18N.dict();
      box.focus();
      try { box.select(); } catch (_) {}
      try { if (hostDocument.execCommand && hostDocument.execCommand('copy')) return showToast(dict.toast.exported); } catch (_) {}
      try {
        if (typeof navigator !== 'undefined' && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(box.value).then(function () { showToast(dict.toast.exported); }, function () { showToast(dict.toast.exportFailed, true); });
          return;
        }
      } catch (_) {}
      showToast(dict.toast.exportFailed, true);
    }

    function submitImport() {
      var overlay = hostDocument.getElementById(OVERLAY_ID);
      var box = overlay && overlay.querySelector('[data-import-input]');
      if (!box) return;
      var result = runtime.importState(box.value);
      if (result.ok) {
        var dict = I18N.dict();
        showConfirm(dict.manage.import, dict.manage.importWarn, dict.manage.importBtn, function () {
          var committed = runtime.commitImport(result.state);
          dataPanel = null;
          render();
          Promise.resolve(committed && committed.saved).then(function (saved) {
            if (saved && saved.ok) showToast(I18N.dict().manage.importDone);
            else showToast(I18N.dict().toast.persistenceFailed, true);
          });
        });
      } else {
        // 按失败原因分发文案：超长 vs 解析失败，用户能判断是贴错还是太长。
        var dict = I18N.dict();
        showToast(result.reason === 'oversized' ? dict.manage.importOversized : dict.manage.importParse, true);
      }
    }

    /* ---------- UI app / navigation ---------- */
    function draftIsDirty() {
      var overlay = hostDocument.getElementById(OVERLAY_ID);
      if (!overlay) return false;
      var page = overlay.querySelector('[data-page]');
      var form = page && page.querySelector('[data-marker="player-form"]');
      if (form) {
        var params = nav.params || {};
        var space = runtime.activeSpace();
        var entity = space && CORE.playerFindEntity(space, params.kind, params.id);
        var expected = Object.create(null);
        playerFormFields(params.kind, entity, I18N.dict()).forEach(function (field) {
          expected[field.key] = field.type === 'checkbox' ? !!field.value : String(field.value == null ? '' : field.value);
        });
        if (params.kind === 'note') expected.folderId = String(params.folderId || (entity && entity.folderId) || '');
        var dirty = false;
        Array.prototype.forEach.call(form.querySelectorAll('[data-form-field]'), function (field) {
          var key = field.getAttribute('data-form-field');
          var value = field.type === 'checkbox' ? !!field.checked : String(field.value == null ? '' : field.value);
          if (value !== (expected[key] == null ? '' : expected[key])) dirty = true;
        });
        if (dirty) return true;
      }
      var importBox = overlay.querySelector('[data-import-input]');
      return !!(importBox && CORE.hasText(importBox.value));
    }

    function withDiscardGuard(action) {
      if (!draftIsDirty()) return action();
      var t = I18N.dict();
      showConfirm(t.playerDiscardTitle, t.playerDiscardMessage, t.playerDiscardAction, action);
      return null;
    }

    function navigateView(view, params) {
      return withDiscardGuard(function () { navigateViewNow(view, params); });
    }

    function navigateViewNow(view, params) {
      clearToast();
      // 同行连点两次不重复压栈：栈顶已是同一页时直接复用，返回不用多按一次。
      var top = nav.stack.length ? nav.stack[nav.stack.length - 1] : null;
      var samePage = top && top.app === nav.app && top.view === nav.view && String(top.params && top.params.id) === String(nav.params && nav.params.id);
      if (!samePage) nav.stack.push({ app: nav.app, view: nav.view, params: nav.params });
      nav.view = view;
      nav.params = params || {};
      if (view === 'chat' || view === 'gchat') clearUnread(params && params.id);
      // 打开帖子详情即视为已读：客户端清零 unread（落盘），角标与呼吸光效不再常驻。
      if (view === 'post') clearPostUnread(params && params.id);
      resetSearch();
      armedWipe = null;
      render();
    }

    function switchView(view) {
      return withDiscardGuard(function () { switchViewNow(view); });
    }

    function switchViewNow(view) {
      clearToast();
      nav.view = view || 'root';
      nav.params = {};
      nav.stack = [];
      resetSearch();
      armedWipe = null;
      render();
    }

    // 删除成功后的回退：仅详情页删除时回到列表；列表页删除只刷新当前列表，
    // 避免用户在批量清理时被无故带回首页。
    function backNavSkippingDeleted(kind, id, parentId) {
      var isDetail = ((kind === 'note') && nav.app === 'notes' && nav.view === 'note' && String(nav.params && nav.params.id) === String(id)) ||
        ((kind === 'post') && nav.app === 'forum' && nav.view === 'post' && String(nav.params && nav.params.id) === String(id)) ||
        ((kind === 'contact') && nav.app === 'msg' && nav.view === 'chat' && String(nav.params && nav.params.id) === String(id)) ||
        ((kind === 'group') && nav.app === 'msg' && nav.view === 'gchat' && String(nav.params && nav.params.id) === String(id));
      var formApps = { contact: 'msg', folder: 'notes', note: 'notes', item: 'space', currency: 'space', order: 'market', post: 'forum' };
      var formApp = formApps[kind];
      if (formApp && nav.app === formApp && nav.view === 'form' && String(nav.params && nav.params.id) === String(id)) isDetail = true;
      if (kind === 'contact' && nav.app === 'msg' && nav.view === 'contact-form' && String(nav.params && nav.params.id) === String(id)) isDetail = true;
      if (isDetail) backNavNow();
      else render();
    }

    function backNav() {
      return withDiscardGuard(backNavNow);
    }

    function backNavNow() {
      clearToast();
      // 离开页面时清理武装态与倒计时定时器：否则武装后返回，3 秒后定时器仍会触发
      // 一次多余的整页 render（且 armed 按钮已不在页面上）。
      stopWipeCountdown();
      clearAppTimeout(wipeTimer);
      wipeTimer = 0;
      if (nav.stack.length) {
        var previous = nav.stack.pop();
        nav.app = previous.app;
        nav.view = previous.view;
        nav.params = previous.params || {};
      } else {
        goHomeNow();
        return;
      }
      resetSearch();
      armedWipe = null;
      render();
    }

    // 线程未读点开即清零：当前空间的会话线程（seen 游标对齐尾随回复数）。
    function clearUnread(id) {
      if (!id) return;
      var space = runtime.activeSpace();
      if (!space) return;
      reportSeenPersistence(runtime.markSpaceThreadSeen(space.id, id));
    }

    // 帖子未读点开即清零（与聊天同语义，当前空间内）。
    function clearPostUnread(id) {
      if (!id) return;
      var space = runtime.activeSpace();
      if (!space) return;
      reportSeenPersistence(runtime.markSpacePostSeen(space.id, id));
    }

    function reportSeenPersistence(result) {
      if (!result || result.ok === false || !result.saved) return;
      Promise.resolve(result.saved).then(function (saved) {
        if (!saved || !saved.ok) {
          showToast(I18N.dict().toast.persistenceFailed, true);
          render();
        }
      }, function () {
        showToast(I18N.dict().toast.persistenceFailed, true);
        render();
      });
    }

    function goHome() {
      return withDiscardGuard(goHomeNow);
    }

    function goHomeNow() {
      clearToast();
      resetManagePanels();
      nav = { app: 'home', view: 'root', params: {}, stack: [] };
      resetSearch();
      render();
    }

    function clearOpenLoading(overlay, epoch) {
      if (!overlay || overlay.__yzLoadingOwner !== appOwner) return;
      if (epoch != null && overlay.__yzLoadingEpoch !== epoch) return;
      overlay.classList.remove('loading');
      overlay.setAttribute('aria-busy', 'false');
      var jade = overlay.querySelector('#' + JADE_ID);
      if (jade) jade.inert = false;
      delete overlay.__yzLoadingEpoch;
      delete overlay.__yzLoadingOwner;
    }

    async function open() {
      // 禁用时也要给反馈（与侧边栏 resync/clear 一致的 disabled toast）：
      // 静默返回会让用户以为点了没反应，尤其经宿主侧边栏「打开玉兆」触发时。
      if (!enabled()) { showToast(I18N.dict().toast.disabled, true); return; }
      // 非聊天页（宿主主页/角色卡/设置）不弹法器：侧边栏/输入动作与 FAB 同门控，
      // 否则会在错误页面之上弹出上一个聊天的数据。
      if (!chatActive) { showToast(I18N.dict().toast.noChat, true); return; }
      ensureShell();
      var overlay = hostDocument.getElementById(OVERLAY_ID);
      if (!overlay) return;
      var epoch = ++openEpoch;
      // 异步加载（切聊水化/从存储读快照）期间先显示 loading 态，避免「点了没反应」。
      overlay.__yzLoadingOwner = appOwner;
      overlay.__yzLoadingEpoch = epoch;
      overlay.classList.add('loading');
      overlay.setAttribute('aria-busy', 'true');
      var loadingJade = overlay.querySelector('#' + JADE_ID);
      if (loadingJade) loadingJade.inert = true;
      try {
        var id = await runtime.resolveCurrentChatId();
        if (id !== runtime.activeChatId) {
          clearGenerationContexts(runtime.activeChatId);
          await runtime.switchChat(id);
        }
        // async 期间用户可能已关闭 overlay：epoch 变了则 abort，防止意外重开。
        if (disposed || epoch !== openEpoch || !overlay) return;
        clearOpenLoading(overlay, epoch);
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        clearToast();
        // 确认框若还挂着（弹框期间切了聊天）其锁定聊天已失效：先收起再恢复导航，
        // 避免重新打开后残留一个会误操作的新聊天的确认框。
        hideConfirm();
        resetManagePanels();
        // 回到上次位置：若本会话内曾关闭玉兆，恢复离开时的页面与域（翻一半回来不重头找）；
        // 首开/换聊天后回到主页（savedNav 在 close 时记录、chat:opened 时清空）。
        if (savedNav) {
          nav = savedNav;
          savedNav = null;
        } else {
          nav = { app: 'home', view: 'root', params: {}, stack: [] };
        }
        resetSearch();
        render();
        // 打开时按当前视觉视口收敛玉兆高度（覆盖 iOS 底部工具栏等 vv < 100vh 的场景）。
        if (typeof overlay.__yzFit === 'function') overlay.__yzFit();
        // 打开时把焦点移入对话框。
        var dialog = overlay.querySelector('#' + JADE_ID) || overlay;
        if (typeof dialog.focus === 'function') dialog.focus();
      } catch (error) {
        dbg('open failed', error);
        if (!disposed && epoch === openEpoch) showToast(I18N.dict().toast.persistenceFailed, true);
      } finally {
        clearOpenLoading(overlay, epoch);
      }
    }

    function close() {
      return withDiscardGuard(closeNow);
    }

    function closeNow() {
      var overlay = hostDocument.getElementById(OVERLAY_ID);
      if (!overlay) return;
      ++openEpoch;
      clearToast();
      // 关闭法器时一并收起确认对话框（弹框期间切聊天/关闭后继续确认会误操作）。
      hideConfirm();
      resetManagePanels();
      clearOpenLoading(overlay);
      // 记录离开位置（同一聊天内再打开时恢复），管理页瞬态不保存。
      savedNav = { app: nav.app, view: nav.view, params: nav.params, stack: [] };
      nav = { app: 'home', view: 'root', params: {}, stack: [] };
      resetSearch();
      overlay.classList.remove('open', 'loading');
      overlay.setAttribute('aria-busy', 'false');
      var closedJade = overlay.querySelector('#' + JADE_ID);
      if (closedJade) closedJade.inert = false;
      overlay.setAttribute('aria-hidden', 'true');
      var fab = hostDocument.getElementById(FAB_ID);
      if (fab && typeof fab.focus === 'function') fab.focus();
      // 关闭后立即恢复 FAB 显隐（打开时 render 把 fab.hidden 置 true 隐藏了悬浮球；
      // 这里不走 render，直接按同一门控刷新——否则 × 关闭后 FAB 一直消失，
      // 直到下一次 chat:opened/generation 才重新出现，重开玉兆变得繁琐）。
      if (fab) fab.hidden = !enabled() || !chatActive;
    }

    /* ---------- UI app / overlay events ---------- */
    function bindOverlay(overlay) {
      if (overlay.__yzBound) return;
      overlay.__yzBound = true;
      markBound(overlay);
      function focusablesIn(root) {
        return Array.prototype.filter.call(root.querySelectorAll('button, [href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])'), function (el) {
          if (el.disabled || el.getAttribute('aria-hidden') === 'true') return false;
          return el.offsetParent !== null || (el.getClientRects && el.getClientRects().length > 0);
        });
      }
      listen(overlay, 'click', function (event) {
        if (overlay.classList.contains('loading')) {
          event.preventDefault();
          event.stopPropagation();
          return;
        }
        var target = event.target.closest ? event.target.closest('[data-action]') : null;
        if (target) {
          event.stopPropagation();
          var action = target.getAttribute('data-action');
          if (action === 'close') return close();
          if (action === 'back') return backNav();
          if (action === 'open-feature') return openFeature(target.getAttribute('data-feature'));
          if (action === 'switch-view') return switchView(target.getAttribute('data-view'));
          if (action === 'navigate') return navigateView(target.getAttribute('data-view'), { id: target.getAttribute('data-id') || '' });
          if (action === 'toggle-feature') return toggleFeature(target.getAttribute('data-feature'));
          if (action === 'reset-fab') return resetFabPosition();
          if (action === 'sync-detail') return openSyncDetail();
          // 太极中枢：角色域主页点击打开同步诊断（与插件描述「点击太极核心可查看
          // 同步诊断详情」一致，主页中央按钮不能是死按钮）；功能页点击回主界面。
          // 玩家域主页无同步概念（同步诊断仅角色域），保持无操作的「回主界面」语义。
          if (action === 'core') {
            if (nav.app !== 'home') return resetSearch(), render();
            return openSyncDetail();
          }
          if (action === 'toggle-diag') { diagOpen = !diagOpen; return render(); }
          if (action === 'clear-feature') return armOrClearFeature(target.getAttribute('data-feature'));
          if (action === 'toggle-data-panel') return withDiscardGuard(function () {
            var panel = target.getAttribute('data-panel');
            dataPanel = dataPanel === panel ? null : panel;
            render();
          });
          if (action === 'copy-export') return copyExport();
          if (action === 'import-submit') return submitImport();
          if (action === 'clear-search') { resetSearch(); return render(); }
          if (action === 'switch-space') return withDiscardGuard(function () { nav = { app: 'manage', view: 'spaces', params: {}, stack: nav.stack || [] }; render(); });
          if (action === 'send-thread-msg') return sendThreadMessage(target.getAttribute('data-thread-id') || '');
          if (action === 'send-comment') return sendPostComment();
          if (action === 'new-contact') return openSpaceForm('contact', '', '');
          if (action === 'entity-new') return openSpaceForm(target.getAttribute('data-kind'), '', target.getAttribute('data-folder') || '');
          if (action === 'entity-edit') return openSpaceForm(target.getAttribute('data-kind'), target.getAttribute('data-id') || '', '');
          if (action === 'entity-save') return saveSpaceForm(target.getAttribute('data-kind'), target.getAttribute('data-id') || '');
          if (action === 'entity-delete') return deleteSpaceItem(target.getAttribute('data-kind'), target.getAttribute('data-id') || '');
          if (action === 'delete-contact') return deleteSpaceItem('contact', target.getAttribute('data-id') || '');
          if (action === 'delete-group') return deleteSpaceItem('group', target.getAttribute('data-id') || '');
          if (action === 'delete-message') return deleteSpaceItem('message', target.getAttribute('data-id') || '', target.getAttribute('data-parent-id') || '');
          if (action === 'delete-track') return deleteSpaceItem('track', target.getAttribute('data-id') || '');
          if (action === 'delete-place') return deleteSpaceItem('place', target.getAttribute('data-id') || '');
          if (action === 'space-enter') return switchSpaceTo(target.getAttribute('data-id') || '');
          if (action === 'space-create') return createSpaceFromForm();
          if (action === 'space-flag') return toggleSpaceFlag(target.getAttribute('data-id') || '', target.getAttribute('data-flag') || '');
          if (action === 'space-delete') return deleteSpaceRow(target.getAttribute('data-id') || '');
          if (action === 'space-rename') return renameSpaceRow(target.getAttribute('data-id') || '');
          // 数量步进：调整相邻数量输入框的值（不整页重渲染，保留焦点与编辑状态）。
          if (action === 'qty-step') {
            var stepper = target.parentNode;
            var qtyInput = stepper && stepper.querySelector ? stepper.querySelector('[data-form-field="qty"]') : null;
            if (qtyInput) {
              var next = Math.max(0, Math.floor(Number(qtyInput.value) || 0) + (Number(target.getAttribute('data-delta')) || 0));
              qtyInput.value = String(next);
              var minusBtn = stepper.querySelector('[data-delta="-1"]');
              if (minusBtn) minusBtn.disabled = next <= 0;
              clearFormErrors();
              qtyInput.focus();
            }
            return;
          }
          return;
        }
        if (event.target === overlay) close();
      });
      // 检索框输入走 input 事件委托：每次键入只更新内存关键词并重渲染，
      // 纯前端过滤，不触碰任何持久化数据（交互基座第一层的只读约束）。
      listen(overlay, 'input', function (event) {
        if (overlay.classList.contains('loading')) return;
        var lengthInput = event.target && event.target.closest ? event.target.closest('[maxlength]') : null;
        if (lengthInput) {
          var lengthCounter = lengthInput.parentNode && lengthInput.parentNode.querySelector ? lengthInput.parentNode.querySelector('[data-length-counter]') : null;
          if (lengthCounter) lengthCounter.textContent = String(lengthInput.value || '').length + '/' + lengthInput.getAttribute('maxlength');
        }
        var box = event.target.closest ? event.target.closest('[data-search-input]') : null;
        if (!box) return;
        // IME 合成期间（拼音输入法）不触发整页重渲染：每个拼音键位都重建 DOM 会腰斩
        // 合成中的输入法候选；compositionend 后才同步一次。
        if (event.isComposing) return;
        search = String(box.value || '');
        render();
      });
      listen(overlay, 'compositionend', function (event) {
        if (overlay.classList.contains('loading')) return;
        var box = event.target && event.target.closest ? event.target.closest('[data-search-input]') : null;
        if (!box) return;
        search = String(box.value || '');
        render();
      });
      // 模态焦点陷阱：Tab / Shift+Tab 在对话框内的可见按钮间循环，避免焦点移出到背后页面。
      listen(overlay, 'keydown', function (event) {
        if (overlay.classList.contains('loading')) {
          event.preventDefault();
          return;
        }
        // 发言输入框（会话/论坛评论）：回车直接发送（发送后清空输入并重渲染）。
        if (event.key === 'Enter' && event.target && event.target.getAttribute) {
          if (event.target.getAttribute('data-thread-input') !== null) { event.preventDefault(); sendThreadMessage(event.target.getAttribute('data-thread-id') || ''); return; }
          if (event.target.getAttribute('data-comment-input') !== null) { event.preventDefault(); sendPostComment(); return; }
        }
        if (event.key !== 'Tab') return;
        var focusables = focusablesIn(overlay);
        if (!focusables.length) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        var active = hostDocument.activeElement;
        if (event.shiftKey && (active === first || !overlay.contains(active))) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && (active === last || !overlay.contains(active))) {
          event.preventDefault();
          first.focus();
        }
      });
      // 移动端键盘自适应：视觉视口随键盘抬起收缩（100vh 在 iOS WebView 不跟随），
      // 玉兆高度收敛到可视区，否则底部玩家域输入框（composer）被键盘遮挡。
      var vv = hostWindow.visualViewport;
       var fitViewport = function () {
         var jade = overlay.querySelector('#' + JADE_ID);
         if (!jade) return;
         var viewportHeight = vv && Number(vv.height) > 0 ? Number(vv.height) : Number(hostWindow.innerHeight) || 0;
         var room = viewportHeight - 20;
         if (room <= 0) return;
         var normal = room >= 560;
         jade.style.minHeight = normal ? '' : '0px';
          jade.style.height = normal ? '' : Math.max(1, room) + 'px';
        };
        overlay.__yzFit = fitViewport;
        onCleanup(function () { if (overlay.__yzFit === fitViewport) overlay.__yzFit = null; });
        if (vv && typeof vv.addEventListener === 'function') listen(vv, 'resize', fitViewport);
        if (hostWindow && typeof hostWindow.addEventListener === 'function') listen(hostWindow, 'resize', fitViewport);
      // 输入框聚焦时把玉兆内的输入框滚动进可视区（Android WebView 键盘行为差异兜底）。
      listen(overlay, 'focusin', function (event) {
        var target = event.target;
        if (!target || !target.getAttribute) return;
        if (target.getAttribute('data-thread-input') === null &&
            target.getAttribute('data-comment-input') === null && target.getAttribute('data-search-input') === null &&
            target.getAttribute('data-space-input') === null) return;
        setAppTimeout(function () {
          if (hostDocument.documentElement.contains(target) && typeof target.scrollIntoView === 'function') target.scrollIntoView({ block: 'nearest' });
        }, 300);
      });
    }

    // 保存：读取表单全部 data-form-field（含隐藏 folderId、checkbox）→ 直写玩家域。

    // 表单页不整页重渲染（渲染会用落盘值覆盖编辑中内容），这里直接操作 DOM。
    function clearFormErrors() {

    async function saveSpaceForm(kind, id) {
      var overlay = hostDocument.getElementById(OVERLAY_ID);
      var scope = overlay && overlay.querySelector('[data-page]');
      if (!scope) return;
      var raw = {};
      var fields = scope.querySelectorAll('[data-form-field]');
      Array.prototype.forEach.call(fields, function (el) {
        var key = el.getAttribute('data-form-field');
        if (el.type === 'checkbox') raw[key] = el.checked;
        else raw[key] = el.value;
      });
      var dict = I18N.dict();
      // reason → 字段名（playerFormFields 的 key 与运行时校验点一致）。
      var REASON_FIELD = { name: 'name', title: 'title', kind: 'kind', kindClash: 'kind' };
      var space = runtime.activeSpace();
      var saveButton = scope.querySelector('[data-action="entity-save"]');
      var busy = beginBusy(busyKey('form', kind + ':' + id), [saveButton].concat(Array.prototype.slice.call(fields)));
      if (!busy) return;
      var context = captureUiContext();
      try {
        var result = space ? runtime.spaceSaveEntity(space.id, kind, raw, id) : { ok: false, reason: 'space' };
        if (!result || !result.ok) {
          var reason = (result && result.reason) || '';
          if (reason === 'folder') {
            clearFormErrors();
            showToast(dict.playerFormNeedFolder, true);
            return;
          }
          if (reason === 'missing') { showToast(dict.spaceMissingEntity, true); return; }
          if (reason === 'full') { showToast(dict.spaceEntityFull, true); return; }
          var fieldKey = REASON_FIELD[reason];
          if (fieldKey) {
            var label = '';
            playerFormFields(kind, null, dict).forEach(function (f) { if (f.key === fieldKey) label = f.label; });
            var message = reason === 'kindClash' ? dict.playerFormKindClash : tr('runtime.player.formFieldError', { field: label || dict.playerFieldName });
            flagFormError(fieldKey, message);
            showToast(message, true);
            return;
          }
          showToast(dict.spaceMissingEntity, true);
          return;
        }
        var persisted = await Promise.resolve(result.saved);
        if (!persisted || !persisted.ok) { showToast(dict.toast.persistenceFailed, true); return; }
        var currentOverlay = hostDocument.getElementById(OVERLAY_ID);
        var currentSave = currentOverlay && currentOverlay.querySelector('[data-action="entity-save"]');
        if (uiContextMatches(context) && currentSave === saveButton) {
          backNav();
          showToast(I18N.dict().playerSaved);
        }
      } catch (error) {
        dbg('space form save failed', error);
        showToast(dict.toast.persistenceFailed, true);
      } finally {
        endBusy(busy);
      }
    }

    var undoSnap = null;

    async function undoDelete() {
      if (!undoSnap) return;
      var snap = undoSnap;
      undoSnap = null;
      if (snap.chatId && String(snap.chatId) !== String(runtime.activeChatId)) {
        showToast(I18N.dict().toast.stale, true);
        return;
      }
      var result = snap.spaceSnapshot ? runtime.restoreSpace(snap.entity) : runtime.spaceRestoreEntity(snap);
      var persisted = result && result.saved ? await Promise.resolve(result.saved) : result;
      if (result && result.ok && persisted && persisted.ok !== false) {
        showToast(I18N.dict().playerRestored);
        render();
      } else {
        showToast(I18N.dict().spaceMissingEntity, true);
      }

    async function deleteSpaceItem(kind, id, extraId) {
      var key = kind + ':' + id + (extraId ? ':' + extraId : '');
      var next = VIEWS.nextWipeState(armedWipe, key, Date.now());
      clearAppTimeout(wipeTimer);
      wipeTimer = 0;
      var space = runtime.activeSpace();
      if (!next) {
        var result = space ? runtime.spaceDeleteEntity(space.id, kind, id, extraId || '') : { ok: false, reason: 'space' };
        armedWipe = null;
        if (result.ok) {
          var persisted = await Promise.resolve(result.saved);
          if (!persisted || !persisted.ok) { showToast(I18N.dict().toast.persistenceFailed, true); render(); return; }
          undoSnap = result.snapshot && result.snapshot.entity ? result.snapshot : null;
          // 撤销 toast 用 6s 窗口：手机端「读 toast + 抬手点击」2.4s 通常不够。
          if (undoSnap) showToast(I18N.dict().playerDeleted, false, { label: I18N.dict().playerUndo, fn: undoDelete }, 6000);
          else showToast(I18N.dict().playerDeleted);
          backNavSkippingDeleted(kind, id, extraId);
          return;
        }
        showToast(result && result.reason === 'missing' ? I18N.dict().spaceMissingEntity : I18N.dict().spaceMissingEntity, true);
        return;
      }
      armedWipe = next;
      wipeTimer = setAppTimeout(function () {
        armedWipe = null;
        stopWipeCountdown();
        // 武装超时（未确认）：只复位按钮文案，不整页重渲染——表单里未保存的编辑不能被
        // 实体旧值覆盖（整页 render 会用落盘实体重建表单，丢失编辑中的输入）。
        var node = hostDocument.querySelector('#' + OVERLAY_ID + ' .yz-clear-btn.armed[data-wipe-base]');
        if (node) {
          node.classList.remove('armed');
          node.textContent = I18N.dict().playerDelete;
          if (node.dataset && node.dataset.wipeLabel) node.setAttribute('aria-label', node.dataset.wipeLabel);
          if (node.dataset) { delete node.dataset.wipeBase; delete node.dataset.wipeLabel; }
        } else {
          render();
        }
      }, VIEWS.WIPE_CONFIRM_MS + 50);
      startWipeCountdown();
      // 武装第一击：局部更新按钮文案，不整页重渲染（保留表单未保存的编辑）。
      var confirmKey = 'delete' + kind.charAt(0).toUpperCase() + kind.slice(1) + 'Confirm';
      var confirmLabel = I18N.dict()[confirmKey] || I18N.dict().deleteConfirmShort || I18N.dict().playerDeleteConfirm;
      var btn = hostDocument.querySelector('#' + OVERLAY_ID + ' [data-kind="' + CORE.escapeHtml(kind) + '"][data-id="' + CORE.escapeHtml(String(id)) + '"].yz-clear-btn') ||
        hostDocument.querySelector('#' + OVERLAY_ID + ' [data-action="delete-' + CORE.escapeHtml(kind) + '"][data-id="' + CORE.escapeHtml(String(id)) + '"]');
      if (btn) {
        btn.classList.add('armed');
        if (btn.getAttribute('aria-label')) btn.setAttribute('data-wipe-label', btn.getAttribute('aria-label'));
        btn.setAttribute('data-wipe-base', confirmLabel);
        btn.setAttribute('aria-label', confirmLabel);
        btn.textContent = confirmLabel;
        return;
      }
      render();
    }

    /* ---------- UI app / floating button ---------- */
    function clampFab(fab, left, top) {
      var width = fab.offsetWidth || 54, height = fab.offsetHeight || 54;
      var maxX = Math.max(6, hostWindow.innerWidth - width - 6);
      var maxY = Math.max(6, hostWindow.innerHeight - height - 6);
      return { x: Math.max(6, Math.min(Number(left) || 6, maxX)), y: Math.max(6, Math.min(Number(top) || 6, maxY)) };
    }

    function placeFab(fab, position) {
      var next = clampFab(fab, position.x, position.y);
      fab.style.left = next.x + 'px';
      fab.style.top = next.y + 'px';
      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
      return next;
    }

    async function restoreFabPosition(fab) {
      var value = null;
      try { value = await Promise.resolve(tavoApi.get(POS_KEY, 'global')); } catch (_) {}
      if (!value) {
        try { value = hostWindow.localStorage.getItem('yz:fab_position'); } catch (_) {}
      }
      if (disposed) return;
      if (value) {
        try { placeFab(fab, typeof value === 'string' ? JSON.parse(value) : value); } catch (_) {}
      }
      fab.classList.add('ready');
    }

    async function persistFab(position) {
      var raw = JSON.stringify(position);
      try { await Promise.resolve(tavoApi.set(POS_KEY, raw, 'global')); } catch (_) {}
      try { hostWindow.localStorage.setItem('yz:fab_position', raw); } catch (_) {}
    }

    function resetFabPosition() {
      var fab = hostDocument.getElementById(FAB_ID);
      if (!fab) return;
      var width = fab.offsetWidth || 54, height = fab.offsetHeight || 54;
      var x = Math.max(6, hostWindow.innerWidth - width - FAB_MARGIN_RIGHT);
      var y = Math.max(6, hostWindow.innerHeight - height - FAB_MARGIN_BOTTOM);
      placeFab(fab, { x: x, y: y });
      persistFab({ x: x, y: y });
      suppressClickUntil = Date.now() + 600;
      showToast(I18N.dict().toast.fabReset);
    }

    function bindFab(fab) {
      if (fab.__yzBound) return;
      fab.__yzBound = true;
      markBound(fab);
      onCleanup(function () { delete fab.__yzPositionRestored; });
      var holdTimer = 0;
      function cancelHold() { if (holdTimer) { clearAppTimeout(holdTimer); holdTimer = 0; } }
      onCleanup(cancelHold);
      listen(fab, 'click', function (event) {
        if (Date.now() < suppressClickUntil) { event.preventDefault(); event.stopPropagation(); return; }
        open();
      });
      listen(fab, 'pointerdown', function (event) {
        if (event.button != null && event.button !== 0) return;
        var rect = fab.getBoundingClientRect();
        drag = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, left: rect.left, top: rect.top, moved: false };
        try { fab.setPointerCapture(event.pointerId); } catch (_) {}
        cancelHold();
        holdTimer = setAppTimeout(function () {
          holdTimer = 0;
          if (!drag || drag.moved) return;
          drag = null;
          fab.classList.remove('dragging');
          resetFabPosition();
        }, 900);
      });
      listen(hostDocument, 'pointermove', function (event) {
        if (!drag || (drag.pointerId != null && event.pointerId !== drag.pointerId)) return;
        var dx = event.clientX - drag.startX, dy = event.clientY - drag.startY;
        // 拖拽判定阈值：触屏点按时手指的轻微位移（>4px 很常见）不应被当成拖拽，
        // 否则「想点开玉佩却把它挪了 2px」且该次点击被抑制、毫无反馈。8px 兼顾跟手与防误触。
        if (!drag.moved && Math.hypot(dx, dy) < 8) return;
        cancelHold();
        drag.moved = true;
        fab.classList.add('dragging');
        placeFab(fab, { x: drag.left + dx, y: drag.top + dy });
      }, true);
      function finish(event) {
        if (!drag || (drag.pointerId != null && event.pointerId !== drag.pointerId)) return;
        cancelHold();
        var moved = drag.moved;
        drag = null;
        fab.classList.remove('dragging');
        if (moved) {
          suppressClickUntil = Date.now() + 500;
          var rect = fab.getBoundingClientRect();
          persistFab({ x: Math.round(rect.left), y: Math.round(rect.top) });
        }
      }
      listen(hostDocument, 'pointerup', finish, true);
      listen(hostDocument, 'pointercancel', finish, true);
      listen(hostWindow, 'resize', function () {
        var rect = fab.getBoundingClientRect();
        placeFab(fab, { x: rect.left, y: rect.top });
      });
    }

    // —— 正文协议块剥离（DOM 层）——
    // 权威路径在 Hook 层：generation:success 同步剥离事件正文，message hook 应用快照；
    // DOM 扫描只是兜底，覆盖宿主自行重渲染消息文本的场景（如滚动时懒渲染旧楼层）。
    // 禁用插件或关闭 auto_strip 时必须停止一切 DOM 改写。

    /* ---------- UI app / DOM stripping ---------- */
    function isOwnNode(node) {
      var el = node && node.nodeType === 1 ? node : node && node.parentElement;
      if (!el || typeof el.closest !== 'function') return false;
      return !!(el.closest('#' + OVERLAY_ID) || el.closest('#' + FAB_ID));
    }

    function looksLikeEnvelope(value) {
      return /(?:<|&lt;)y(?:z|$)/i.test(String(value == null ? '' : value));
    }

    function stripNodes(nodes) {
      Array.prototype.forEach.call(nodes, function (node) {
        if (isOwnNode(node)) return;
        if (!node.nodeValue || !looksLikeEnvelope(node.nodeValue)) return;
        var next = PROTOCOL.stripStreamTail(node.nodeValue);
        if (next !== node.nodeValue) node.nodeValue = next;
      });
    }

    function collectTextNodes(root, out) {
      if (!root || isOwnNode(root)) return;
      if (root.nodeType === 3) { out.push(root); return; }
      if (root.nodeType !== 1) return;
      try {
        var walker = hostDocument.createTreeWalker(root, hostWindow.NodeFilter.SHOW_TEXT);
        var node;
        while ((node = walker.nextNode())) out.push(node);
      } catch (_) {}
    }

    // 全量扫描：启动时与每条协议消息后执行（协议消息可能含旧协议残留）。
    function stripVisibleBlocks() {
      if (!enabled() || !autoStrip()) return;
      var nodes = [];
      collectTextNodes(hostDocument.body, nodes);
      stripNodes(nodes);
    }

    // 只处理本批变更实际触及的文本节点：
    // characterData 的 target 就是文本节点本身；childList 取新增节点内的文本。
    function stripFromMutations(mutations) {
      if (!enabled() || !autoStrip() || !mutations.length) return;
      var nodes = [];
      mutations.forEach(function (mutation) {
        if (mutation.type === 'characterData') {
          if (mutation.target && mutation.target.nodeType === 3) nodes.push(mutation.target);
          return;
        }
        if (mutation.addedNodes && mutation.addedNodes.length) {
          Array.prototype.forEach.call(mutation.addedNodes, function (added) { collectTextNodes(added, nodes); });
        }
      });
      stripNodes(nodes);
    }

    /* ---------- UI app / hook handlers ---------- */
    function createHookHandlers() {
      function generationKey(event) {
        event = event || {};
        return CORE.cleanText(event.generationId || event.requestId || event.generation || '', 120);
      }
      async function resyncHistory(){
          // 禁用态与 open() 同语义：统一门控，不静默、不真实改数据。
          if (!enabled()) { showToast(I18N.dict().toast.disabled, true); return; }
          // 非聊天页不操作（activeChatId 是上一个聊天的残留，恢复/清除会作用到它）。
          if (!chatActive) { showToast(I18N.dict().toast.noChat, true); return; }
          // 防重入：异步恢复进行中再点直接忽略（避免误导性的「聊天已切换」红 toast）。
          if (restoreBusy) { showToast(I18N.dict().toast.restoreBusy); return; }
          restoreBusy = true;
         var result = null;
         var chatId = runtime.activeChatId;
         try {
             result = await runtime.rebuildFromHistory(chatId);
         } catch (error) {
            dbg('snapshot restore failed', error);
            restoreBusy = false;
            showToast(I18N.dict().toast.restoreFailed, true);
            return;
          }
           restoreBusy = false;
           if (disposed || chatId !== runtime.activeChatId) return;
           runtime.syncArchive(chatId);
           render();
          // stale：异步窗口内切了聊天（结果不属于当前会话），不误报「无快照」。
          if (result && result.stale) { showToast(I18N.dict().toast.stale, true); return; }
          showToast(result && result.restored ? I18N.dict().toast.rebuilt : I18N.dict().toast.noSnapshot);
        }
      var rebuildTimer = 0;
      // 不带信封的 message:updated（编辑中间楼层等）不改变水化签名：去抖从世界书快照
      // 恢复一次，让法器数据与权威存储保持一致（数据源是世界书，编辑正文不影响它）。
      function scheduleRebuild() {
        if (rebuildTimer) return;
         rebuildTimer = setAppTimeout(async function () {
           rebuildTimer = 0;
           if (disposed) return;
           var chatId = runtime.activeChatId;
           try {
             await runtime.rebuildFromHistory(chatId);
             if (disposed || chatId !== runtime.activeChatId) return;
             runtime.syncArchive(chatId);
             render();
          } catch (error) { dbg('snapshot restore failed', error); }
        }, 600);
      }

      async function onMessage(event) {
        if (disposed || !enabled()) return;
        var message = event && event.message || {};
        if (message.role !== 'assistant') return;
        var payload = pickEnvelopePayload(message);
        if (!containsEnvelope(payload)) {
          if ((event.type || '') === 'message:updated') scheduleRebuild();
          return;
        }
         var chatId = await runtime.resolveCurrentChatId(event);
         if (disposed) return;
        if (discardedEnvelopeHashes[stableHash(payload)]) {
          if (autoStrip()) stripEventFields(message);
          delete discardedEnvelopeHashes[stableHash(payload)];
          return;
         }
         var messageKey = generationKey(event);
         var context = getGenerationContext(chatId, messageKey);
         if (!context || !context.token) {
           if (autoStrip()) stripEventFields(message);
           discardedEnvelopeHashes[stableHash(payload)] = Date.now();
           return;
         }
         var result = await runtime.applyText(payload, chatId, event.type || 'message', {
           visibility: context.visibility,
           generationToken: context.token,
           realtime: true
         });
         if (result.parseError) showToast(I18N.dict().toast.parseError, true, { label: I18N.dict().diag.title, fn: function () { openSyncDetail(); } });
         if (result.oversized) showToast(I18N.dict().toast.oversized, true);
         if (result.discarded && containsEnvelope(payload)) discardedEnvelopeHashes[stableHash(payload)] = Date.now();
         if (!disposed && result.changed && chatId === runtime.activeChatId) runtime.syncArchive(chatId);
         if (!disposed && chatId === runtime.activeChatId) {
           render();
           setAppTimeout(stripVisibleBlocks, 0);
         }
      }
      async function onChatOpened(event){
        if (disposed) return;
        chatActive = true;
        undoSnap = null;
        var chatId = await runtime.resolveCurrentChatId(event);
        if (disposed) return;
        if (chatId !== runtime.activeChatId) clearGenerationContexts(runtime.activeChatId);
        await runtime.switchChat(chatId);
        if (disposed) return;
        nav = { app: 'home', view: 'root', params: {}, stack: [] };
        // 换聊天后放弃上一聊天的离开位置：新会话从主页开始。
        savedNav = null;
        // 切换聊天后刷新 {{user}} 用户身份名缓存（发言署名用；用户身份可能随聊天不同）。
        refreshOwnerName();
        render();
      }

      async function onChatUpdated(event){
        var hostId = await runtime.resolveCurrentChatId();
        if (disposed) return;
        var eventId = runtime.eventChatId(event);
        if (eventId && eventId !== hostId) return;
        if (hostId !== runtime.activeChatId) {
          clearGenerationContexts(runtime.activeChatId);
          await runtime.switchChat(hostId);
        }
        if (!disposed) render();
      }

      function onChatClosed(){
        // 离开聊天（含切到宿主设置等非聊天页）时收起 overlay 并隐藏 FAB：
        // 避免继续显示上一个聊天的数据，也避免悬浮入口压在非聊天页面上。
        chatActive = false;
        clearGenerationContexts(runtime.activeChatId);
        // 收起可能弹起的确认对话框（其锁定的聊天已失效，继续挂着会误清新聊天）。
        hideConfirm();
        close();
        render();
      }

      async function onGenerationPrepare(event){
        if (disposed || !enabled()) return event;
        // 七个功能全部封印时提示词只剩空壳，模型也不会输出协议块：直接跳过注入省 token。
        if (!anyFeatureEnabled()) return event;
        var prepareKey = generationKey(event);
        var prepareStartChat = runtime.eventChatId(event) || runtime.activeChatId;
        var prepareStartToken = captureGenerationToken(prepareStartChat);
        discardedEnvelopeHashes = Object.create(null);
        // 重新生成/继续同样经过这里：注入基线前先确保目标聊天的持久化状态已加载完毕
        // （插件重载后 switchChat 的加载/水化是异步的，直接读内存会拿到空白态 → 空基线）。
        var chatId = await runtime.resolveCurrentChatId(event);
        if (disposed) return event;
        if (chatId !== runtime.activeChatId) {
          clearGenerationContexts(runtime.activeChatId);
          await runtime.switchChat(chatId);
        }
        await runtime.settle();
        if (disposed) return event;
        var liveChatId = await runtime.resolveCurrentChatId();
        var eventChatId = runtime.eventChatId(event);
        if (chatId !== runtime.activeChatId || liveChatId !== chatId || (eventChatId && eventChatId !== chatId)) return event;
        var token = captureGenerationToken(chatId);
        if (!token) return event;
        // prepare 自身也可能在清除期间挂起；不能把清除前开始的请求重新登记为新请求。
        var startEpoch = prepareStartToken && Number(prepareStartToken.clearEpoch);
        var currentEpoch = Number(token.clearEpoch);
        if (String(prepareStartChat || '') === String(chatId || '') && Number.isFinite(startEpoch) &&
            Number.isFinite(currentEpoch) && startEpoch !== currentEpoch) return event;
        var state = runtime.current();
        var defaultSpace = CORE.defaultSpaceState(state);
        var spaceInfos = state.spaces.map(function (sp) {
          return {
            name: CORE.spaceDisplayName(state, sp, ''),
            isDefault: !!sp.isDefault,
            sendToAI: sp.sendToAI !== false,
            allowAIWrite: sp.allowAIWrite !== false
          };
        });
        var allIssues = [];
        state.spaces.forEach(function (sp) {
          CORE.safeArray(sp.sync && sp.sync.issues, 20).forEach(function (issue) { if (allIssues.length < 6) allIssues.push(issue); });
        });
        var currentRows = PROMPT.buildCurrent(state, featureFlags);
        var generationContext = saveGenerationContext(chatId, prepareKey, token, currentRows.visibility);
        var ctx = {
          // 强制全量轮：默认空间从未同步、封印切换/版本更新后的持久化标记，或本轮内存标记；
          // 其余轮次一律 diff 增量（非默认空间恒 diff，见提示词空间规则）。
          forceFull: !defaultSpace || defaultSpace.revision === 0 || flagsDirty || state.pendingFull === true,
          issues: allIssues,
          spaces: spaceInfos,
          characterName: defaultSpace ? CORE.spaceDisplayName(state, defaultSpace, '') : '',
          // 当前数据基线：全量轮与 diff 轮都注入（sendToAI 空间分组），模型据此沿用既有 id 与未变化行。
          current: currentRows
        };
        return PROMPT.mutatePrepareEvent(event, promptLang(), featureFlags, ctx);
      }

      async function onGenerationSuccess(event){
        if (disposed || !enabled()) return event;
        var raw = pickEnvelopePayload(event);
        var successKey = generationKey(event);
        // 该 Hook 每个 handler 只有约 5 秒预算且超时整体丢弃：先同步完成纯字符串的正文剥离
        // （阻止协议块进入已保存消息的关键动作），快照应用走异步、持久化已在 runtime 后台化。
        var chatId;
        try { chatId = await runtime.resolveCurrentChatId(event); } catch (_) { chatId = runtime.activeChatId; }
        if (disposed) return event;
        // 带 ID 的结果只能取同 ID 的 prepare；没有 ID 时只取聊天匿名上下文，且清除后永不放行。
        var generationContext = getGenerationContext(chatId, successKey);
        var tokenEpoch = generationContext && generationContext.token && Number(generationContext.token.clearEpoch) || 0;
        if (!successKey && (clearEpochByChat[String(chatId || '')] > 0 || tokenEpoch > 0)) {
          consumeGenerationContext(generationContext, !successKey);
          generationContext = null;
        }
        if (!generationContext || !generationContext.token || String(chatId) !== String(runtime.activeChatId || '')) {
          if (autoStrip()) stripEventFields(event);
          if (containsEnvelope(raw)) discardedEnvelopeHashes[stableHash(raw)] = Date.now();
          if (generationContext) consumeGenerationContext(generationContext, !successKey);
          return event;
        }
        if (autoStrip()) stripEventFields(event);
        if (containsEnvelope(raw)) {
          try {
            var result = await runtime.applyText(raw, chatId, 'generation:success', {
              visibility: generationContext.visibility,
              generationToken: generationContext.token,
              realtime: true
            });
            if (result && result.discarded) discardedEnvelopeHashes[stableHash(raw)] = Date.now();
            if (result.parseError) showToast(I18N.dict().toast.parseError, true, { label: I18N.dict().diag.title, fn: function () { openSyncDetail(); } });
            if (result.oversized) showToast(I18N.dict().toast.oversized, true);
            // 成功落过一轮全量后清除强制全量标记（内存 + 持久化）。
            if (!disposed && chatId === runtime.activeChatId && result.full && result.changed) {
              flagsDirty = false;
              var st = runtime.current();
              if (st && st.pendingFull) {
                st.pendingFull = false;
                runtime.saveChat(runtime.activeChatId);
              }
            }
            // 数据有变化时后台刷新世界书（消息归档条目 + 全状态快照；不占用本 Hook 的 5 秒预算等待）。
            if (!disposed && result.changed && chatId === runtime.activeChatId) runtime.syncArchive(chatId);
          } catch (error) { dbg('generation:success apply failed', error); }
        }
        consumeGenerationContext(generationContext, !successKey);
        if (!disposed && chatId === runtime.activeChatId) render();
        return event;
      }

      function onGenerationError(event){
        if (disposed || !enabled()) return;
        var chatId = runtime.eventChatId(event) || runtime.activeChatId;
        var errorKey = generationKey(event);
        consumeGenerationContext(getGenerationContext(chatId, errorKey), !errorKey);
        discardedEnvelopeHashes = Object.create(null);
        showToast(I18N.dict().toast.generationError, true);
      }

      function onGenerationCancelled(event){
        if (disposed || !enabled()) return;
        var chatId = runtime.eventChatId(event) || runtime.activeChatId;
        var cancelKey = generationKey(event);
        consumeGenerationContext(getGenerationContext(chatId, cancelKey), !cancelKey);
        discardedEnvelopeHashes = Object.create(null);
        showToast(I18N.dict().toast.cancelled, true);
      }
      return {
        open: open,
        resyncHistory: resyncHistory,
        clearData: armSidebarClear,
        chatOpened: onChatOpened,
        chatUpdated: onChatUpdated,
        chatClosed: onChatClosed,
        generationPrepare: onGenerationPrepare,
        generationSuccess: onGenerationSuccess,
        messageAdded: onMessage,
        messageUpdated: onMessage,
        messageDeleted: async function (event) {
           var id = await runtime.resolveCurrentChatId(event);
           if (disposed || id !== runtime.activeChatId) return;
           await runtime.rebuildFromHistory(id);
           if (disposed || id !== runtime.activeChatId) return;
           runtime.syncArchive(id);
           render();
        },
        generationError: onGenerationError,
        generationCancelled: onGenerationCancelled
      };
    }
    async function start() {
      if (started || disposed) return;
      started = true;
      if (hostWindow && typeof hostWindow.addEventListener === 'function') listen(hostWindow, 'pagehide', dispose);
      setupFeatureSync();
      try {
        var i18nApi = tavoApi.plugin && tavoApi.plugin.i18n;
        if (i18nApi && typeof i18nApi.onChange === 'function') {
          var onI18nChange = function () { if (!disposed) { I18N.invalidate(); refreshConfirmText(); render(); } };
          var unsubscribe = i18nApi.onChange(onI18nChange);
          if (typeof unsubscribe === 'function') onCleanup(unsubscribe);
          else if (unsubscribe && typeof unsubscribe.unsubscribe === 'function') onCleanup(function () { unsubscribe.unsubscribe(); });
        }
      } catch (_) {}
      await loadFeatureFlags();
      if (disposed) return;
      ensureShell();
      var id = await runtime.resolveCurrentChatId();
      await runtime.switchChat(id);
      if (disposed) return;
      refreshOwnerName();
      // FAB chatActive 启动兜底：宿主可能已停在聊天页而不重发 chat:opened（插件重载等），
      // 此时 FAB 会永久隐藏。启动时主动探测一次：宿主 API 能返回当前聊天即视为在聊天中
      // （不能用 resolveCurrentChatId——它回退到 activeChatId，非聊天页也会得到非空值）。
      try {
        var startChat = tavoApi.chat && typeof tavoApi.chat.current === 'function' ? await Promise.resolve(tavoApi.chat.current()) : null;
        if (startChat && startChat.id != null && CORE.hasText(startChat.id)) chatActive = true;
      } catch (_) {}
      render();
       listen(hostDocument, 'keydown', function (event) {
         if (event.key !== 'Escape') return;
         var confirm = hostDocument.getElementById('yz1-confirm');
         if (confirm && confirm.classList.contains('show')) {
           event.preventDefault();
           event.stopImmediatePropagation();
           hideConfirm();
           return;
         }
         closeNow();
       }, true);
      // 从设置页等返回聊天页时刷新 FAB 显隐与 overlay 状态（配置变化无 Hook 可订阅；
      // 部分环境返回时不翻转 visibilitychange，补充 window focus 兜底）。
       listen(hostDocument, 'visibilitychange', function () { if (!hostDocument.hidden && !disposed) render(); });
       listen(hostWindow, 'focus', function () { if (!disposed) render(); });
      // 增量剥离通道：变更记录排队 + 220ms 防抖，只扫描新增/变化的文本节点，
      // 避免流式生成期间的高频变更触发全文档扫描。队列设上限防内存膨胀。
      var stripTimer = 0;
      var pendingMutations = [];

       function scheduleStrip(batch) {
         if (disposed) return;
         pendingMutations = pendingMutations.concat(batch);
        if (pendingMutations.length > 2000) pendingMutations = pendingMutations.slice(-2000);
        if (stripTimer) return;
         stripTimer = setAppTimeout(function () {
          stripTimer = 0;
          var queued = pendingMutations;
          pendingMutations = [];
          var overlay = hostDocument.getElementById(OVERLAY_ID);
          // overlay 打开时用户在法器界面内，本轮后台剥离直接放弃。
          if (overlay && overlay.classList.contains('open')) return;
          stripFromMutations(queued);
        }, 220);
      }

       try {
         var observer = new hostWindow.MutationObserver(scheduleStrip);
         observer.observe(hostDocument.documentElement, { childList: true, subtree: true, characterData: true });
         onCleanup(function () { try { observer.disconnect(); } catch (_) {} });
       } catch (error) { dbg('MutationObserver unavailable', error); }
       if (!disposed) stripVisibleBlocks();
    }

    // 宿主只消费 start；open/close/render 均由闭包内的绑定函数直接引用。
    return { start: start, dispose: dispose, hooks: function () { return hookHandlers || (hookHandlers = createHookHandlers()); } };
  }

  var APP = { create: create, pickEnvelopePayload: pickEnvelopePayload, stripEventFields: stripEventFields };

    var app = APP.create({ tavo: tavo, document: document, window: window });
    shared.attachUI(app);
    Promise.resolve(app.start()).catch(function (error) {
      try { console.error('[Yu Zhao] UI start failed', error); } catch (_) {}
    });
  }

  boot(shared);
})();
</script>
</body>
</html>
