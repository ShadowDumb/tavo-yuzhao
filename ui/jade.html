  /* ---------- UI app / fab ---------- */
  /* ---------- UI app / fab ---------- */
  function createFab(ctx) {
    var document = ctx.document;
    var window = ctx.window;
    var dialogs = ctx.dialogs;
    var tr = ctx.tr || function (k) { return k; };

    function getFabEl() {
      return document ? document.getElementById('yu-zhao-fab') : null;
    }
    function getBadgeEl() {
      return document ? document.getElementById('yu-zhao-fab-badge') : null;
    }

    var isDragging = false;
    var moved = false;
    var startX = 0;
    var startY = 0;
    var initialLeft = 0;
    var initialTop = 0;
    var longPressTimer = null;
    var suppressClickUntil = 0;
    var lastOpenTime = 0;

    var DEFAULT_BOTTOM = 96;
    var DEFAULT_RIGHT = 22;
    var POS_KEY = 'yz_fab_pos';

    function clampFab(fab, left, top) {
      var vw = (window && window.innerWidth) || 800;
      var vh = (window && window.innerHeight) || 600;
      var size = (fab && fab.offsetWidth) || 54;
      var edgeMargin = 18; // 留出曲面屏边缘缓冲，防止悬浮球贴到弧面死角
      return {
        x: Math.max(edgeMargin, Math.min(vw - size - edgeMargin, Number(left) || edgeMargin)),
        y: Math.max(edgeMargin, Math.min(vh - size - edgeMargin, Number(top) || edgeMargin))
      };
    }

    function placeFab(x, y) {
      var fab = getFabEl();
      if (!fab) return;
      var pos = clampFab(fab, x, y);
      fab.style.left = pos.x + 'px';
      fab.style.top = pos.y + 'px';
      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
    }

    function resetPosition() {
      var fab = getFabEl();
      if (!fab) return;
      fab.style.left = 'auto';
      fab.style.top = 'auto';
      fab.style.right = DEFAULT_RIGHT + 'px';
      fab.style.bottom = DEFAULT_BOTTOM + 'px';
      try {
        if (window && window.localStorage) window.localStorage.removeItem(POS_KEY);
      } catch (_) {}
      suppressClickUntil = Date.now() + 600;
      if (dialogs) dialogs.toast(tr('runtime.toast.fabReset') || '已复位玉佩位置', 'info');
    }

    function restorePosition() {
      var fab = getFabEl();
      if (!fab) return;
      try {
        if (window && window.localStorage) {
          var saved = window.localStorage.getItem(POS_KEY);
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && typeof parsed.x === 'number' && typeof parsed.y === 'number') {
              placeFab(parsed.x, parsed.y);
            }
          }
        }
      } catch (_) {}
    }

    function persistPosition(x, y) {
      try {
        if (window && window.localStorage) {
          window.localStorage.setItem(POS_KEY, JSON.stringify({ x: Math.round(x), y: Math.round(y) }));
        }
      } catch (_) {}
    }

    function updateBadge(count) {
      var badge = getBadgeEl();
      if (!badge) return;
      var num = Number(count) || 0;
      if (num > 0) {
        badge.textContent = num > 99 ? '99+' : String(num);
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }

    function triggerOpen() {
      if (Date.now() < suppressClickUntil) return;
      if (Date.now() - lastOpenTime < 300) return;
      lastOpenTime = Date.now();
      var nav = ctx.navigation;
      if (nav) nav.open();
    }

    function initEvents() {
      var fab = getFabEl();
      if (!fab) return;
      if (fab.dataset && fab.dataset.yzFabBound) return;
      if (fab.dataset) fab.dataset.yzFabBound = '1';

      restorePosition();

      // 原生 Click 监听（兼容性最广的触发通道）
      fab.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (moved) return;
        triggerOpen();
      });

      // Pointer 手势与长按处理
      fab.addEventListener('pointerdown', function (e) {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        isDragging = true;
        moved = false;
        startX = e.clientX;
        startY = e.clientY;

        var rect = fab.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        // 长按 900ms 复位
        longPressTimer = setTimeout(function () {
          if (!moved) {
            resetPosition();
            isDragging = false;
          }
        }, 900);

        try { fab.setPointerCapture(e.pointerId); } catch (_) {}
      });

      function handlePointerMove(e) {
        if (!isDragging) return;
        var dx = e.clientX - startX;
        var dy = e.clientY - startY;
        // 阈值设为 14px，避免普通点按时微小手抖被判定为拖拽
        if (Math.hypot(dx, dy) > 14) {
          moved = true;
          if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
          }
          placeFab(initialLeft + dx, initialTop + dy);
        }
      }

      function handlePointerEnd(e) {
        if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        if (isDragging) {
          try { fab.releasePointerCapture(e.pointerId); } catch (_) {}
          isDragging = false;
          if (moved) {
            suppressClickUntil = Date.now() + 400;
            var rect = fab.getBoundingClientRect();
            persistPosition(rect.left, rect.top);
          } else {
            // 未拖动：直接触发展开
            triggerOpen();
          }
        }
      }

      fab.addEventListener('pointermove', handlePointerMove);
      fab.addEventListener('pointerup', handlePointerEnd);
      fab.addEventListener('pointercancel', handlePointerEnd);

      if (document) {
        document.addEventListener('pointermove', handlePointerMove);
        document.addEventListener('pointerup', handlePointerEnd);
        document.addEventListener('pointercancel', handlePointerEnd);
      }

      if (window && typeof window.addEventListener === 'function') {
        window.addEventListener('resize', function () {
          var f = getFabEl();
          if (!f) return;
          var rect = f.getBoundingClientRect();
          if (f.style.left && f.style.left !== 'auto') {
            placeFab(rect.left, rect.top);
          }
        });
      }
    }

    initEvents();

    return {
      resetPosition: resetPosition,
      updateBadge: updateBadge
    };
  }

  /* ---------- UI app / navigation ---------- */
  /* ---------- UI app / navigation ---------- */
  function createNavigation(ctx) {
    var state = ctx.state;
    var shell = ctx.shell;
    var runtime = ctx.runtime;

    function open(targetView) {
      state.open = true;
      if (targetView) {
        state.activeView = targetView;
        state.viewStack = ['wheel'];
      }
      shell.updateVisibility();
      shell.render();
    }

    function close() {
      state.open = false;
      state.modal = null;
      shell.updateVisibility();
    }

    function toggle() {
      if (state.open) close();
      else open();
    }

    function navigate(view, options) {
      options = options || {};
      if (state.activeView && state.activeView !== view && !options.replace) {
        state.viewStack.push(state.activeView);
      }
      state.activeView = view || 'wheel';
      state.activeTab = options.tab || '';
      state.searchQuery = '';
      state.selectedId = options.selectedId || null;
      state.selectedItem = options.selectedItem || null;
      state.modal = null;
      
      // 当进入某个具体卦位时，向 runtime 报告已查看该分区
      if (view && view !== 'wheel' && view !== 'sync' && view !== 'spaces' && runtime) {
        var current = runtime.current();
        var space = runtime.activeSpace();
        if (space && space.sync && Array.isArray(space.sync.appliedSeen)) {
          if (space.sync.appliedSeen.indexOf(view) < 0) {
            space.sync.appliedSeen.push(view);
          }
        }
      }

      shell.render();
    }

    function back() {
      if (state.modal) {
        state.modal = null;
        shell.render();
        return;
      }
      if (state.selectedId) {
        state.selectedId = null;
        state.selectedItem = null;
        shell.render();
        return;
      }
      if (state.viewStack.length > 0) {
        var prev = state.viewStack.pop();
        state.activeView = prev || 'wheel';
      } else {
        state.activeView = 'wheel';
      }
      state.searchQuery = '';
      state.selectedId = null;
      state.selectedItem = null;
      shell.render();
    }

    function setTab(tab) {
      state.activeTab = tab;
      shell.render();
    }

    function setSearch(query) {
      state.searchQuery = String(query || '').trim().toLowerCase();
      shell.render();
    }

    function selectItem(id, item) {
      state.selectedId = id;
      state.selectedItem = item || null;
      shell.render();
    }

    return {
      open: open,
      close: close,
      toggle: toggle,
      navigate: navigate,
      back: back,
      setTab: setTab,
      setSearch: setSearch,
      selectItem: selectItem
    };
  }

  /* ---------- UI app / dom-strip ---------- */
  /* ---------- UI app / dom-strip ---------- */
  function createDomStrip(ctx) {
    var document = ctx.document;
    var getFlags = ctx.getFlags || function () { return { enabled: true, auto_strip: true }; };
    var observer = null;
    var timer = null;

    function stripInElement(rootEl) {
      if (!rootEl) return;
      var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null, false);
      var node;
      var pattern = /<yz_jade[\s\S]*?<\/yz_jade>/gi;
      while ((node = walker.nextNode())) {
        if (node.nodeValue && pattern.test(node.nodeValue)) {
          node.nodeValue = node.nodeValue.replace(pattern, '').trim();
        }
      }
    }

    function scheduleScan() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () {
        var flags = getFlags();
        if (flags && flags.enabled === false) return;
        if (flags && flags.auto_strip === false) return;
        stripInElement(document.body);
      }, 220);
    }

    function start() {
      if (typeof MutationObserver === 'undefined' || !document || !document.body) return;
      if (observer) return;
      observer = new MutationObserver(function (mutations) {
        var hasAdded = mutations.some(function (m) { return m.addedNodes && m.addedNodes.length > 0; });
        if (hasAdded) scheduleScan();
      });
      observer.observe(document.body, { childList: true, subtree: true });
      scheduleScan();
    }

    function stop() {
      if (observer) {
        observer.disconnect();
        observer = null;
      }
      if (timer) {
        clearTimeout(timer);
        timer = null;
      }
    }

    return {
      start: start,
      stop: stop,
      scanNow: scheduleScan
    };
  }

  /* ---------- UI app / hooks ---------- */
  /* ---------- UI app / hooks ---------- */
  function createHooks(ctx) {
    var runtime = ctx.runtime;
    var state = ctx.state;
    var shell = ctx.shell;
    var fab = ctx.fab;
    var navigation = ctx.navigation;
    var dialogs = ctx.dialogs;
    var domStrip = ctx.domStrip;
    var getFlags = ctx.getFlags || function () { return { enabled: true, auto_strip: true, lang: 'zh' }; };
    var tr = ctx.tr || function (k) { return k; };

    function open(options) {
      if (navigation) navigation.open((options && options.view) || null);
    }

    function resyncHistory() {
      if (runtime && runtime.activeChatId) {
        runtime.rebuildFromHistory(runtime.activeChatId).then(function (res) {
          if (res && res.ok && runtime.syncArchive) {
            runtime.syncArchive(runtime.activeChatId);
          }
          if (dialogs) {
            dialogs.toast(res && res.ok ? (tr('runtime.toast.rebuilt') || '已从历史重新同步') : (tr('runtime.toast.restoreFailed') || '同步重建失败'), res && res.ok ? 'success' : 'warn');
          }
          updateBadges();
          if (shell) shell.render();
        });
      }
    }

    function clearData() {
      if (runtime && runtime.activeChatId && ctx.dataActions) {
        ctx.dataActions.clearChatData(runtime.activeChatId);
      }
    }

    async function chatOpened(event) {
      var chatId = event && (event.chatId || (event.chat && event.chat.id));
      if (!chatId && ctx.tavo && ctx.tavo.chat && typeof ctx.tavo.chat.current === 'function') {
        try {
          var cur = await Promise.resolve(ctx.tavo.chat.current());
          if (cur) chatId = cur.id;
        } catch (_) {}
      }
      state.chatActive = true;
      if (chatId && runtime) {
        await runtime.switchChat(chatId);
        updateBadges();
        if (shell) shell.render();
      }
      if (domStrip) domStrip.scanNow();
      if (shell) shell.updateVisibility();
      return event;
    }

    function chatUpdated(event) {
      if (shell) shell.render();
      return event;
    }

    function chatClosed(event) {
      state.chatActive = false;
      if (navigation) navigation.close();
      if (shell) shell.updateVisibility();
      return event;
    }

    async function generationPrepare(event) {
      if (!event || typeof event !== 'object') return event;
      var flags = getFlags();
      if (flags && flags.enabled === false) return event;
      if (!runtime) return event;

      var current = runtime.current();
      if (!current) return event;

      var sealed = current.sealed || {};
      var featFlags = {};
      var anyEnabled = false;
      ['tablet', 'msg', 'forum', 'notes', 'market', 'space', 'map'].forEach(function (k) {
        var on = !sealed[k];
        featFlags[k] = on;
        if (on) anyEnabled = true;
      });
      if (!anyEnabled) return event;

      var defaultSpace = CORE.defaultSpaceState(current);
      var spaceInfos = (current.spaces || []).map(function (sp) {
        return {
          name: CORE.spaceDisplayName(sp),
          isDefault: !!sp.isDefault,
          sendToAI: sp.sendToAI !== false,
          allowAIWrite: sp.allowAIWrite !== false
        };
      });

      var allIssues = [];
      (current.spaces || []).forEach(function (sp) {
        CORE.safeArray(sp.sync && sp.sync.issues, 20).forEach(function (issue) {
          if (allIssues.length < 6) allIssues.push(issue);
        });
      });

      var currentRows = PROMPT.buildCurrent(current, featFlags);
      var lang = (flags && flags.lang) || 'zh';

      var ctxPrepare = {
        forceFull: !defaultSpace || defaultSpace.revision === 0 || current.pendingFull === true,
        issues: allIssues,
        spaces: spaceInfos,
        characterName: defaultSpace ? CORE.spaceDisplayName(defaultSpace) : '',
        current: currentRows
      };

      return PROMPT.mutatePrepareEvent(event, lang, featFlags, ctxPrepare);
    }

    async function generationSuccess(event) {
      if (!event || typeof event !== 'object') return event;
      var flags = getFlags();
      if (flags && flags.enabled === false) return event;
      if (!runtime) return event;

      var raw = APP.pickEnvelopePayload(event);

      // 1. 同步剥离协议块（阻止写入消息正文）
      if (flags.auto_strip !== false && typeof PROTOCOL !== 'undefined' && PROTOCOL.stripBlocks) {
        APP.stripEventFields(event);
      }

      // 2. 异步解析应用与持久化
      if (APP.containsEnvelope(raw)) {
        try {
          var chatId = (event && (event.chatId || (event.chat && event.chat.id))) || runtime.activeChatId;
          var res = await runtime.applyText(raw, chatId, 'generation:success');
          if (res && res.changed && runtime.syncArchive) {
            runtime.syncArchive(chatId);
          }
          if (res && res.parseError && dialogs) {
            dialogs.toast(tr('runtime.toast.parseError') || '天道机缘解析异常', 'danger');
          }
          updateBadges();
          if (shell) shell.render();
        } catch (err) {
          CORE.dbg('generation:success apply failed', err);
        }
      }

      if (domStrip) domStrip.scanNow();
      return event;
    }

    async function messageAdded(event) {
      var flags = getFlags();
      if (flags && flags.enabled === false) return event;
      var message = (event && event.message) || {};
      if (message.role !== 'assistant') return event;
      var payload = APP.pickEnvelopePayload(message);
      if (!APP.containsEnvelope(payload)) return event;
      if (flags.auto_strip !== false) APP.stripEventFields(message);
      try {
        var chatId = (event && event.chatId) || runtime.activeChatId;
        var res = await runtime.applyText(payload, chatId, event.type || 'message:added');
        if (res && res.changed && runtime.syncArchive) {
          runtime.syncArchive(chatId);
        }
        updateBadges();
        if (shell) shell.render();
      } catch (err) {
        CORE.dbg('messageAdded apply failed', err);
      }
      if (domStrip) domStrip.scanNow();
      return event;
    }

    function messageUpdated(event) {
      if (domStrip) domStrip.scanNow();
      return event;
    }

    async function messageDeleted(event) {
      if (runtime && runtime.activeChatId) {
        await runtime.rebuildFromHistory(runtime.activeChatId);
        if (runtime.syncArchive) runtime.syncArchive(runtime.activeChatId);
        updateBadges();
        if (shell) shell.render();
      }
      return event;
    }

    function generationError(event) {
      if (dialogs) dialogs.toast(tr('runtime.toast.generationError') || '天道机缘感应中断', 'warn');
      return event;
    }

    function generationCancelled(event) {
      if (dialogs) dialogs.toast(tr('runtime.toast.cancelled') || '施法已中止', 'info');
      return event;
    }

    function updateBadges() {
      if (!runtime || !fab) return;
      var space = runtime.activeSpace();
      if (!space) return;
      var unread = 0;
      if (space.chats) {
        CORE.safeArray(space.chats.contacts).forEach(function (c) { unread += Number(c.unread) || 0; });
        CORE.safeArray(space.chats.groups).forEach(function (g) { unread += Number(g.unread) || 0; });
      }
      if (space.forum) {
        CORE.safeArray(space.forum.posts).forEach(function (p) { unread += Number(p.unread) || 0; });
      }
      fab.updateBadge(unread);
    }

    return {
      open: open,
      resyncHistory: resyncHistory,
      clearData: clearData,
      chatOpened: chatOpened,
      chatUpdated: chatUpdated,
      chatClosed: chatClosed,
      generationPrepare: generationPrepare,
      generationSuccess: generationSuccess,
      messageAdded: messageAdded,
      messageUpdated: messageUpdated,
      messageDeleted: messageDeleted,
      generationError: generationError,
      generationCancelled: generationCancelled,
      updateBadges: updateBadges
    };
  }

  /* ---------- UI app / shell ---------- */
  function createShell(ctx) {
    var document = ctx.document;
    var window = ctx.window;
    var state = ctx.state;
    var runtime = ctx.runtime;
    var navigation = ctx.navigation;
    var tr = ctx.tr || function (k) { return k; };

    function $(id) {
      return document ? document.getElementById(id) : null;
    }

    function updateVisibility() {
      var flags = (typeof ctx.getFlags === 'function' && ctx.getFlags()) || {};
      var isEnabled = flags.enabled !== false;

      var overlay = $('yu-zhao-overlay');
      if (overlay) {
        if (state.open && isEnabled) {
          overlay.classList.add('yz-open');
          overlay.style.display = 'flex';
        } else {
          overlay.classList.remove('yz-open');
          overlay.style.display = 'none';
        }
      }

      var fab = $('yu-zhao-fab');
      if (fab) {
        if (isEnabled && !state.open) {
          fab.style.display = 'flex';
        } else {
          fab.style.display = 'none';
        }
      }
    }

    function renderHeader() {
      var spaceNameEl = $('yu-zhao-space-name');
      if (spaceNameEl) {
        var space = runtime ? runtime.activeSpace() : null;
        var name = space ? CORE.spaceDisplayName(space) : (tr('runtime.space.defaultName') || '默认空间');
        spaceNameEl.textContent = name;
      }

      var backBtn = $('yu-zhao-back-btn');
      if (backBtn) {
        var showBack = state.activeView !== 'wheel' || state.selectedId != null;
        backBtn.style.display = showBack ? 'flex' : 'none';
      }
    }

    function render() {
      try {
        renderHeader();
        var bodyEl = $('yu-zhao-body');
        if (!bodyEl) return;

        if (typeof PAGE !== 'undefined' && typeof PAGE.render === 'function') {
          bodyEl.innerHTML = PAGE.render(ctx);
          if (typeof PAGE.bindEvents === 'function') {
            PAGE.bindEvents(bodyEl, ctx);
          }
        }
        renderDialogs();
      } catch (err) {
        try { console.error('[Yu Zhao] render failed:', err); } catch (_) {}
      }
    }

    function renderDialogs() {
      var dialogsEl = $('yu-zhao-dialogs');
      if (!dialogsEl) return;
      if (!state.modal) {
        dialogsEl.innerHTML = '';
        return;
      }

      var m = state.modal;
      if (m.type === 'confirm') {
        dialogsEl.innerHTML =
          '<div class="yz-modal-backdrop">' +
            '<div class="yz-modal-card">' +
              '<h3 class="yz-modal-title">' + CORE.escapeHtml(m.title) + '</h3>' +
              '<p style="font-size: 13px; color: var(--yz-text-secondary); line-height: 1.6;">' + CORE.escapeHtml(m.message) + '</p>' +
              '<div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">' +
                '<button id="yz-dialog-cancel" class="yz-btn-icon" style="width: auto; padding: 6px 14px; font-size: 12px;">' + CORE.escapeHtml(m.cancelLabel) + '</button>' +
                '<button id="yz-dialog-confirm" class="yz-btn-primary" style="padding: 6px 16px; font-size: 12px;' + (m.danger ? ' background: linear-gradient(135deg, #ef4444, #b91c1c);' : '') + '">' + CORE.escapeHtml(m.confirmLabel) + '</button>' +
              '</div>' +
            '</div>' +
          '</div>';

        var cancelBtn = dialogsEl.querySelector('#yz-dialog-cancel');
        var confirmBtn = dialogsEl.querySelector('#yz-dialog-confirm');
        if (cancelBtn) {
          cancelBtn.addEventListener('click', function () {
            if (typeof m.onCancel === 'function') m.onCancel();
            state.modal = null;
            renderDialogs();
          });
        }
        if (confirmBtn) {
          confirmBtn.addEventListener('click', function () {
            if (typeof m.onConfirm === 'function') m.onConfirm();
            state.modal = null;
            renderDialogs();
          });
        }
      } else if (m.type === 'entity-form') {
        var fieldsHtml = (m.fields || []).map(function (f) {
          var val = m.initialData && m.initialData[f.name] != null ? m.initialData[f.name] : (f.defaultValue != null ? f.defaultValue : '');
          if (f.type === 'checkbox') {
            return '<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--yz-text-primary); cursor: pointer;">' +
              '<input type="checkbox" name="' + f.name + '"' + (val ? ' checked' : '') + ' style="accent-color: var(--yz-jade-light);">' +
              '<span>' + CORE.escapeHtml(f.label) + '</span>' +
            '</label>';
          }
          if (f.type === 'select') {
            var optionsHtml = (f.options || []).map(function (opt) {
              return '<option value="' + CORE.escapeHtml(opt.value) + '"' + (String(opt.value) === String(val) ? ' selected' : '') + '>' + CORE.escapeHtml(opt.label) + '</option>';
            }).join('');
            return '<div style="display: flex; flex-direction: column; gap: 4px;">' +
              '<label style="font-size: 12px; color: var(--yz-text-secondary);">' + CORE.escapeHtml(f.label) + '</label>' +
              '<select name="' + f.name + '" class="yz-input" style="background: rgba(10, 26, 28, 0.9);">' + optionsHtml + '</select>' +
            '</div>';
          }
          if (f.type === 'textarea') {
            return '<div style="display: flex; flex-direction: column; gap: 4px;">' +
              '<label style="font-size: 12px; color: var(--yz-text-secondary);">' + CORE.escapeHtml(f.label) + '</label>' +
              '<textarea name="' + f.name + '" class="yz-input" rows="4" placeholder="' + CORE.escapeHtml(f.placeholder || '') + '">' + CORE.escapeHtml(val) + '</textarea>' +
            '</div>';
          }
          return '<div style="display: flex; flex-direction: column; gap: 4px;">' +
            '<label style="font-size: 12px; color: var(--yz-text-secondary);">' + CORE.escapeHtml(f.label) + '</label>' +
            '<input type="' + (f.type || 'text') + '" name="' + f.name + '" value="' + CORE.escapeHtml(val) + '" class="yz-input" placeholder="' + CORE.escapeHtml(f.placeholder || '') + '">' +
          '</div>';
        }).join('');

        dialogsEl.innerHTML =
          '<div class="yz-modal-backdrop">' +
            '<div class="yz-modal-card" style="max-height: 85vh; overflow-y: auto;">' +
              '<h3 class="yz-modal-title">' + CORE.escapeHtml(m.title) + '</h3>' +
              '<form id="yz-entity-form" style="display: flex; flex-direction: column; gap: 12px;">' +
                fieldsHtml +
                '<div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">' +
                  '<button type="button" id="yz-form-cancel" class="yz-btn-icon" style="width: auto; padding: 6px 14px; font-size: 12px;">' + CORE.escapeHtml(m.cancelLabel) + '</button>' +
                  '<button type="submit" class="yz-btn-primary" style="padding: 6px 18px; font-size: 12px;">' + CORE.escapeHtml(m.submitLabel) + '</button>' +
                '</div>' +
              '</form>' +
            '</div>' +
          '</div>';

        var form = dialogsEl.querySelector('#yz-entity-form');
        var formCancel = dialogsEl.querySelector('#yz-form-cancel');
        if (formCancel) {
          formCancel.addEventListener('click', function () {
            state.modal = null;
            renderDialogs();
          });
        }
        if (form) {
          form.addEventListener('submit', function (e) {
            e.preventDefault();
            var formData = {};
            (m.fields || []).forEach(function (f) {
              var input = form.elements[f.name];
              if (!input) return;
              if (f.type === 'checkbox') formData[f.name] = !!input.checked;
              else if (f.type === 'number') formData[f.name] = Number(input.value) || 0;
              else formData[f.name] = String(input.value || '').trim();
            });
            if (typeof m.onSubmit === 'function') m.onSubmit(formData);
            state.modal = null;
            renderDialogs();
          });
        }
      }
    }

    function initHeaderEvents() {
      function nav() {
        return ctx.navigation;
      }
      var logoBtn = $('yu-zhao-logo-btn');
      var spaceBtn = $('yu-zhao-space-btn');
      var backBtn = $('yu-zhao-back-btn');
      var syncBtn = $('yu-zhao-sync-btn');
      var closeBtn = $('yu-zhao-close-btn');
      var overlay = $('yu-zhao-overlay');

      if (overlay && !overlay.dataset.yzBound) {
        overlay.dataset.yzBound = '1';
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay && nav()) {
            nav().close();
          }
        });
      }

      if (logoBtn && !logoBtn.dataset.yzBound) {
        logoBtn.dataset.yzBound = '1';
        logoBtn.addEventListener('click', function () { if (nav()) nav().navigate('wheel'); });
      }
      if (spaceBtn && !spaceBtn.dataset.yzBound) {
        spaceBtn.dataset.yzBound = '1';
        spaceBtn.addEventListener('click', function () { if (nav()) nav().navigate('spaces'); });
      }
      if (backBtn && !backBtn.dataset.yzBound) {
        backBtn.dataset.yzBound = '1';
        backBtn.addEventListener('click', function () { if (nav()) nav().back(); });
      }
      if (syncBtn && !syncBtn.dataset.yzBound) {
        syncBtn.dataset.yzBound = '1';
        syncBtn.addEventListener('click', function () { if (nav()) nav().navigate('sync'); });
      }
      if (closeBtn && !closeBtn.dataset.yzBound) {
        closeBtn.dataset.yzBound = '1';
        closeBtn.addEventListener('click', function () { if (nav()) nav().close(); });
      }

      // Esc 键监听
      if (document && typeof document.addEventListener === 'function' && !document.__yzEscBound) {
        document.__yzEscBound = true;
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && state.open) {
            if (state.modal) {
              state.modal = null;
              renderDialogs();
            } else if (state.activeView !== 'wheel') {
              if (nav()) nav().back();
            } else {
              if (nav()) nav().close();
            }
          }
        });
      }
    }

    initHeaderEvents();

    return {
      updateVisibility: updateVisibility,
      render: render,
      renderHeader: renderHeader,
      renderDialogs: renderDialogs
    };
  }

  /* ---------- UI app / entry ---------- */
  /* ---------- UI app / entry ---------- */
  function containsEnvelope(value) {
    return /<yz_[a-z0-9_]+\b/i.test(String(value == null ? '' : value));
  }

  function pickEnvelopePayload(event) {
    event = event || {};
    var text = String(event.text == null ? '' : event.text);
    var content = String(event.content == null ? '' : event.content);
    if (containsEnvelope(text)) return text;
    if (containsEnvelope(content)) return content;
    return text || content;
  }

  function stripEventFields(event) {
    if (!event || typeof event !== 'object') return event;
    ['text', 'content'].forEach(function (key) {
      if (!Object.prototype.hasOwnProperty.call(event, key) || event[key] == null) return;
      var raw = String(event[key]);
      var visible = PROTOCOL.stripBlocks(raw);
      event[key] = visible;
    });
    return event;
  }

  var APP = {
    pickEnvelopePayload: pickEnvelopePayload,
    stripEventFields: stripEventFields,
    containsEnvelope: containsEnvelope,

    create: function (options) {
      options = options || {};
      var localWindow = options.window || (typeof window !== 'undefined' ? window : globalThis);
      var localDocument = options.document || (typeof document !== 'undefined' ? document : null);
      var tavoApi = options.tavo || (typeof tavo !== 'undefined' ? tavo : {});

      var hostWindow = localWindow;
      var hostDocument = localDocument;
      try {
        if (localWindow && localWindow.top && localWindow.top.document) {
          hostWindow = localWindow.top;
          hostDocument = localWindow.document || localWindow.top.document;
        }
      } catch (_) {}

      var getFlags = function () {
        var config = tavoApi && tavoApi.plugin && tavoApi.plugin.config;
        return {
          enabled: config && typeof config.get === 'function' ? config.get('enabled') !== false : true,
          auto_strip: config && typeof config.get === 'function' ? config.get('auto_strip') !== false : true,
          lang: (config && typeof config.get === 'function' && config.get('lang')) || 'zh'
        };
      };

      var tr = makeTranslator(tavoApi);
      I18N.setTranslator(tr);

      var local = hostWindow && hostWindow.localStorage ? hostWindow.localStorage : null;
      var runtime = RUNTIME.createRuntime(tavoApi, local, getFlags, { window: hostWindow });
      var state = createUiState();

      var ctx = {
        window: hostWindow,
        document: hostDocument,
        tavo: tavoApi,
        state: state,
        runtime: runtime,
        tr: tr,
        getFlags: getFlags
      };

      var dialogs = createDialogs(ctx);
      ctx.dialogs = dialogs;

      // shell 与 navigation 互相引用：shell 通过 ctx.navigation 惰性访问导航；
      // 因此按 dialogs → shell → navigation → dataActions → forms → fab 顺序创建，
      // 保证每个模块在构建期捕获到的依赖都已就绪。
      var shell = createShell(ctx);
      ctx.shell = shell;

      var navigation = createNavigation(ctx);
      ctx.navigation = navigation;

      var dataActions = createDataActions(ctx);
      ctx.dataActions = dataActions;

      var forms = createForms(ctx);
      ctx.forms = forms;

      var fab = createFab(ctx);
      ctx.fab = fab;

      var domStrip = createDomStrip(ctx);
      ctx.domStrip = domStrip;
      domStrip.start();

      var hooks = createHooks(ctx);
      ctx.hooks = hooks;

      // 国际化语言切换订阅
      try {
        var i18nApi = tavoApi && tavoApi.plugin && tavoApi.plugin.i18n;
        if (i18nApi && typeof i18nApi.onChange === 'function') {
          i18nApi.onChange(function () {
            I18N.invalidate();
            if (shell) shell.render();
          });
        }
      } catch (_) {}

      // 启动探测当前聊天
      async function start() {
        try {
          var startChat = tavoApi.chat && typeof tavoApi.chat.current === 'function' ? await Promise.resolve(tavoApi.chat.current()) : null;
          if (startChat && startChat.id != null && CORE.hasText(startChat.id)) {
            state.chatActive = true;
            await runtime.switchChat(startChat.id);
          }
        } catch (_) {}
        if (shell) {
          shell.updateVisibility();
          shell.render();
        }
      }
      start();

      var app = {
        state: state,
        runtime: runtime,
        navigation: navigation,
        shell: shell,
        fab: fab,
        dialogs: dialogs,
        forms: forms,
        dataActions: dataActions,
        domStrip: domStrip,
        hooks: function () { return hooks; },
        dispose: function () {
          if (domStrip) domStrip.stop();
          if (runtime) runtime.dispose();
        }
      };

      return app;
    }
  };

    if (typeof document !== "undefined") {
      var allFabs = document.querySelectorAll("#yu-zhao-fab");
      if (allFabs.length > 1) { for (var i = 0; i < allFabs.length - 1; i++) allFabs[i].remove(); }
      var allOverlays = document.querySelectorAll("#yu-zhao-overlay");
      if (allOverlays.length > 1) { for (var j = 0; j < allOverlays.length - 1; j++) allOverlays[j].remove(); }
      var allDialogs = document.querySelectorAll("#yu-zhao-dialogs");
      if (allDialogs.length > 1) { for (var k = 0; k < allDialogs.length - 1; k++) allDialogs[k].remove(); }
      var allToasts = document.querySelectorAll("#yu-zhao-toasts");
      if (allToasts.length > 1) { for (var l = 0; l < allToasts.length - 1; l++) allToasts[l].remove(); }
    }

    var app = APP.create({ tavo: typeof tavo !== "undefined" ? tavo : {}, document: typeof document !== "undefined" ? document : null, window: typeof window !== "undefined" ? window : globalThis });
    shared.attachUI(app);

    try {
      if (typeof host.addEventListener === "function") {
        host.addEventListener("yu-zhao:open", function () {
          if (app && app.navigation) app.navigation.open();
        });
      }
    } catch (_) {}
  }

  if (shared) boot(shared);
})();
</script>
</body>
</html>
